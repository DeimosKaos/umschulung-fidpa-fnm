<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="spitzeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="410" rx="14" fill="url(#bgGrad)"/>
  <text x="550" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.2">PYRAMIDENSCHEMA® · LF 11.05: ERGÄNZENDE PROZESSMODELLIERUNG MIT UML</text>

  <rect x="140" y="45" width="820" height="86" rx="12" fill="url(#spitzeGrad)" opacity="0.92"/>
  <rect x="140" y="45" width="820" height="86" rx="12" fill="none" stroke="#a5f3fc" stroke-width="1.5"/>
  <text x="550" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">UML ergänzt BPMN um präzise System- und Softwaresichten (Use-Cases,</text>
  <text x="550" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Sequenzen, Aktivitäten und statische Klassendiagramme).</text>

  <line x1="340" y1="131" x2="205" y2="185" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="550" y1="131" x2="550" y2="185" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="760" y1="131" x2="895" y2="185" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,4"/>

  <rect x="40" y="185" width="320" height="190" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.8"/>
  <rect x="40" y="185" width="320" height="36" rx="12" fill="#8b5cf6" opacity="0.22"/>
  <text x="56" y="209" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#c4b5fd">1. Verhaltensdiagramme</text>
  <text x="56" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Use-Case: Akteure &amp; Systemgrenze</text>
  <text x="56" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">  (&lt;&lt;include&gt;&gt; vs. &lt;&lt;extend&gt;&gt;)</text>
  <text x="56" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Aktivitätsdiagramm: Kontrollfluss</text>
  <text x="56" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Sequenzdiagramm: zeitlicher</text>
  <text x="56" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">  Nachrichtenaustausch (APIs)</text>
  <text x="56" y="350" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Zustandsdiagramm: Objektstatus</text>

  <rect x="390" y="185" width="320" height="190" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="1.8"/>
  <rect x="390" y="185" width="320" height="36" rx="12" fill="#06b6d4" opacity="0.22"/>
  <text x="406" y="209" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#67e8f9">2. Struktur (Klassendiagramm)</text>
  <text x="406" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Klasse: Name, Attribute,</text>
  <text x="406" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">  Methoden (+ public / - private)</text>
  <text x="406" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Multiplizitäten: 1, 0..1, 1..*, *</text>
  <text x="406" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Assoziation: kennt / nutzt</text>
  <text x="406" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Vererbung (◁): &#x27;ist ein&#x27;</text>

  <rect x="740" y="185" width="320" height="190" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <rect x="740" y="185" width="320" height="36" rx="12" fill="#10b981" opacity="0.22"/>
  <text x="756" y="209" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">3. Aggregation vs. Komposition</text>
  <text x="756" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Aggregation (leere Raute ◇):</text>
  <text x="756" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">  Teil überlebt ohne Ganzes</text>
  <text x="756" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Komposition (volle Raute ◆):</text>
  <text x="756" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">  Existenzabhängig! Ganzes weg</text>
  <text x="756" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">  → Teile auch gelöscht</text>
  <text x="756" y="350" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• BPMN = Fachablauf, UML = System</text>
</svg>