<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" height="100%" style="background:#0f172a;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Spitze -->
  <rect x="140" y="18" width="820" height="96" rx="12" fill="url(#gTop)" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="550" y="47" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1.2">SPITZE · KERNPROBLEM &amp; ZIEL (LF 2.10)</text>
  <text x="550" y="74" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Kundenprojekte rechnen &amp; steuern: Bedarf bis Angebot</text>
  <text x="550" y="98" text-anchor="middle" fill="#cbd5e1" font-size="13.5">Lasten-/Pflichtenheft, Magisches Dreieck, Dreisatz, Bezugs-/Zuschlagskalkulation &amp; Nutzwert</text>

  <!-- Verbindungslinien -->
  <path d="M550 114 L195 148 M550 114 L550 148 M550 114 L905 148" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Nukleus 1 -->
  <rect x="30" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#818cf8" stroke-width="2"/>
  <text x="195" y="176" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 1 · BEDARF &amp; PROJEKT</text>
  <line x1="55" y1="188" x2="335" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Bedarfsanalyse &amp; Auswahl:</text>
  <text x="55" y="234" fill="#cbd5e1" font-size="12.5">• Ist-/Soll-Analyse mit dem Kunden</text>
  <text x="55" y="253" fill="#cbd5e1" font-size="12.5">• Lastenheft (WAS) → Pflichtenheft (WIE)</text>
  <text x="55" y="272" fill="#cbd5e1" font-size="12.5">• Nutzwertanalyse: gewichtete Kriterien</text>
  <text x="55" y="298" fill="#f1f5f9" font-size="13.5" font-weight="600">Projektsteuerung (DIN 69901):</text>
  <text x="55" y="318" fill="#38bdf8" font-size="12.5">• Magisches Dreieck: Zeit, Kosten, Qual.</text>
  <text x="55" y="337" fill="#cbd5e1" font-size="12.5">• SMART-Ziele &amp; Meilensteine</text>
  <text x="55" y="356" fill="#cbd5e1" font-size="12.5">• Amortisation &amp; ROI (Wirtschaftlichkeit)</text>

  <!-- Nukleus 2 -->
  <rect x="385" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="176" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 2 · KALKULATION &amp; DREISATZ</text>
  <line x1="410" y1="188" x2="690" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="410" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Dreisatz (Kersken 2.3.1):</text>
  <text x="410" y="234" fill="#cbd5e1" font-size="12.5">• Proportional (mehr m = höherer Preis)</text>
  <text x="410" y="253" fill="#cbd5e1" font-size="12.5">• Antiproportional (mehr Leute = kürzer)</text>
  <text x="410" y="280" fill="#f1f5f9" font-size="13.5" font-weight="600">Handelskalkulation (Vorwärts):</text>
  <text x="410" y="300" fill="#34d399" font-size="12.5">• Listeneinkauf - Rabatt - Skonto +</text>
  <text x="410" y="317" fill="#34d399" font-size="12.5">  Bezugskosten = Bezugspreis</text>
  <text x="410" y="336" fill="#cbd5e1" font-size="12.5">• + Gemeinkosten = Selbstkosten</text>
  <text x="410" y="355" fill="#cbd5e1" font-size="12.5">• + Gewinn = Barverkauf (+ Skonto/Rab.)</text>

  <!-- Nukleus 3 -->
  <rect x="740" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#fbbf24" stroke-width="2"/>
  <text x="905" y="176" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 3 · PRAXIS &amp; IHK-FALLE</text>
  <line x1="765" y1="188" x2="1045" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="765" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">IT-Angebote (AP1-Klassiker):</text>
  <text x="765" y="234" fill="#cbd5e1" font-size="12.5">• Hardware + Lizenzen + Arbeitszeit</text>
  <text x="765" y="253" fill="#cbd5e1" font-size="12.5">• TCO (Anschaffung + Betriebskosten)</text>
  <text x="765" y="282" fill="#f87171" font-size="13.5" font-weight="600">Typische IHK-Fallen:</text>
  <text x="765" y="302" fill="#fca5a5" font-size="12.5">• Kundenskonto &amp; -rabatt immer</text>
  <text x="765" y="319" fill="#fca5a5" font-size="12.5">  IM HUNDERT (auf 98 % / 90 % teilen)!</text>
  <text x="765" y="338" fill="#fca5a5" font-size="12.5">• Bezugskosten erst NACH Skonto auf</text>
  <text x="765" y="355" fill="#fca5a5" font-size="12.5">  den Bareinkaufspreis addieren!</text>
</svg>
