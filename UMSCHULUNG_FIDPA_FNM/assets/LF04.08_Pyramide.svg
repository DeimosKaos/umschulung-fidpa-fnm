<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410">
  <rect width="1100" height="410" fill="#0f172a" rx="14"/>
  <text x="550" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">LF 4.08 – Technische Gegenmaßnahmen: Firewalls, DMZ, IDS &amp; Abschottung</text>
  <text x="550" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Netzwerkzonen, Linux netfilter/iptables, Intrusion Detection, chroot &amp; Pentesting (Kersken 21.2.2)</text>

  <!-- Col 1: Firewalls & DMZ -->
  <rect x="48" y="80" width="328" height="308" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="212" y="106" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">1. Firewalls &amp; DMZ</text>

  <rect x="66" y="122" width="292" height="106" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="142" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Zonen-Architektur</text>
  <text x="80" y="161" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Host-Paketfilter vs. Application Gateway</text>
  <text x="80" y="179" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Bastion-Host: filtert gesamten Traffic</text>
  <text x="80" y="197" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• DMZ: Puffer-Netz vor Firmennetz für</text>
  <text x="88" y="213" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Web-, Mail-, VPN-Server + autorisierte Proxys</text>

  <rect x="66" y="236" width="292" height="136" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="256" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Linux netfilter / iptables</text>
  <text x="80" y="275" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Chains: INPUT, OUTPUT, FORWARD,</text>
  <text x="88" y="291" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">PREROUTING, POSTROUTING</text>
  <text x="80" y="310" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Tabellen: filter, nat (SNAT/DNAT), mangle</text>
  <text x="80" y="328" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Targets: ACCEPT, DROP (still verwerfen),</text>
  <text x="88" y="344" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">REJECT (mit Absage), QUEUE, RETURN</text>

  <!-- Col 2: IDS & Abschottung -->
  <rect x="394" y="80" width="328" height="308" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="558" y="106" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">2. IDS &amp; Abschottung</text>

  <rect x="412" y="122" width="292" height="114" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="426" y="142" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Intrusion Detection Systems (IDS)</text>
  <text x="426" y="161" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Host-Überwachung (z. B. tripwire):</text>
  <text x="434" y="177" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">meldet Systemänderungen / Rootkits</text>
  <text x="426" y="196" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Network IDS (z. B. Snort): prüft Traffic</text>
  <text x="426" y="216" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11">Wichtig: IDS VOR Netzanschluss einrichten!</text>

  <rect x="412" y="244" width="292" height="128" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="426" y="264" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Isolation: chroot, Container, VMs</text>
  <text x="426" y="283" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• chroot-„Käfig“: Unterverzeichnis als</text>
  <text x="434" y="299" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">scheinbares Root-Verzeichnis `/`</text>
  <text x="426" y="319" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Container (Docker) &amp; VMs: Dienste</text>
  <text x="434" y="335" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">sauber voneinander abschotten</text>

  <!-- Col 3: Pentesting & Passwörter -->
  <rect x="740" y="80" width="312" height="308" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="896" y="106" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">3. Prüfung &amp; Passwörter</text>

  <rect x="758" y="122" width="276" height="106" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="772" y="142" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Schwachstellen-Scans</text>
  <text x="772" y="161" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Eigenes Netz mit Scannern (Nessus)</text>
  <text x="780" y="177" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">aktiv nach offenen Lücken prüfen</text>
  <text x="772" y="197" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Recht: § 202c StGB (nur rein kriminelle</text>
  <text x="780" y="213" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Zwecke strafbar)</text>

  <rect x="758" y="236" width="276" height="136" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="772" y="256" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Passwort-Regeln (Kersken)</text>
  <text x="772" y="276" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Keine einzelnen Wörter (Merksatz!)</text>
  <text x="772" y="295" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Groß/Klein + Ziffern + Sonderzeichen</text>
  <text x="772" y="314" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Niemals aufschreiben</text>
  <text x="772" y="333" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Regelmäßig wechseln</text>
</svg>
