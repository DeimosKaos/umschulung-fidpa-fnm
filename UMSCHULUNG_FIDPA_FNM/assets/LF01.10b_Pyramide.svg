<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="410" rx="14" fill="#0f172a"/>
  <path d="M 550 112 L 550 142 L 190 142 L 190 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 142 L 910 142 L 910 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="24" width="820" height="88" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="550" y="52" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">SPITZE · KERNAUSSAGE</text>
  <text x="550" y="78" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Stochastik &amp; Statistik machen Datenausreißer, Risiken &amp; Streuung messbar</text>
  <text x="550" y="99" text-anchor="middle" fill="#bfdbfe" font-size="13">(Wahrscheinlichkeit für Zufall · Lagemaße für den Schwerpunkt · Streuung für Verlässlichkeit)</text>

  <rect x="25" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="190" y="204" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">NUKLEUS 1 · WAHRSCHEINLICHKEIT</text>
  <line x1="50" y1="218" x2="330" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="190" y="248" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Laplace: P(E) = günstige / mögliche</text>
  <text x="190" y="278" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Wertebereich immer: 0 ≤ P(E) ≤ 1</text>
  <text x="190" y="302" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Gegenereignis: P(¬E) = 1 − P(E)</text>
  <text x="190" y="334" text-anchor="middle" fill="#94a3b8" font-size="12.5">Unabhängige Ereignisse (UND):</text>
  <text x="190" y="356" text-anchor="middle" fill="#94a3b8" font-size="12.5">P(A ∧ B) = P(A) · P(B)</text>

  <rect x="385" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="204" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">NUKLEUS 2 · LAGEMASSE</text>
  <line x1="410" y1="218" x2="690" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="550" y="248" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Mittelwert (Durchschnitt):</text>
  <text x="550" y="268" text-anchor="middle" fill="#cbd5e1" font-size="12.5">empfindlich gegen Ausreißer!</text>
  <text x="550" y="298" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Median (Zentralwert):</text>
  <text x="550" y="318" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Mitte der sortierten Reihe (robust)</text>
  <text x="550" y="348" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Modus:</text>
  <text x="550" y="368" text-anchor="middle" fill="#cbd5e1" font-size="12.5">häufigster Einzelwert</text>

  <rect x="745" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="910" y="204" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">NUKLEUS 3 · STREUUNG (DPA)</text>
  <line x1="770" y1="218" x2="1050" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="910" y="248" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Spannweite = Max − Min</text>
  <text x="910" y="280" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Varianz (s²): mittlere</text>
  <text x="910" y="300" text-anchor="middle" fill="#cbd5e1" font-size="12.5">quadrierte Abweichung vom Mittel</text>
  <text x="910" y="332" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Standardabweichung (σ = √s²):</text>
  <text x="910" y="354" text-anchor="middle" fill="#94a3b8" font-size="12.5">Streuung in Original-Einheit (z. B. ML)</text>
</svg>
