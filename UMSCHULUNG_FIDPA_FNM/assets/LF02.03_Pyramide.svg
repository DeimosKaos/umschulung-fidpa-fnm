<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="410" rx="14" fill="#0f172a"/>
  <path d="M 550 112 L 550 142 L 190 142 L 190 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 142 L 910 142 L 910 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="24" width="820" height="88" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="550" y="52" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">SPITZE · KERNAUSSAGE</text>
  <text x="550" y="78" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Die Speicherhierarchie (Register → Cache → RAM) schließt die Tempoleistungslücke</text>
  <text x="550" y="99" text-anchor="middle" fill="#bfdbfe" font-size="13">(Schneller Speicher ist teuer &amp; klein · langsamer RAM ist groß &amp; flüchtig)</text>

  <rect x="25" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="190" y="204" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">NUKLEUS 1 · CPU-AUFBAU</text>
  <line x1="50" y1="218" x2="330" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="190" y="248" text-anchor="middle" fill="#cbd5e1" font-size="12.5">ALU (rechnet) + Steuerwerk (steuert)</text>
  <text x="190" y="270" text-anchor="middle" fill="#cbd5e1" font-size="12.5">+ Register (klein, direkt im Kern)</text>
  <text x="190" y="302" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">CISC (x86) vs. RISC (ARM):</text>
  <text x="190" y="324" text-anchor="middle" fill="#94a3b8" font-size="12.5">CISC: viele komplexe Befehle (PC)</text>
  <text x="190" y="344" text-anchor="middle" fill="#94a3b8" font-size="12.5">RISC: wenige einfache (Mobil/effizient)</text>
  <text x="190" y="368" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">Takt ≠ alleinige CPU-Leistung!</text>

  <rect x="385" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="204" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">NUKLEUS 2 · CACHE (L1 / L2 / L3)</text>
  <line x1="410" y1="218" x2="690" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="550" y="248" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">L1-Cache (im Kern, CPU-Takt):</text>
  <text x="550" y="268" text-anchor="middle" fill="#cbd5e1" font-size="12.5">winzig (KiB), jeder Kern hat eigenen</text>
  <text x="550" y="300" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">L2-Cache (im Chip):</text>
  <text x="550" y="320" text-anchor="middle" fill="#cbd5e1" font-size="12.5">größer (KiB–MiB), etwas langsamer</text>
  <text x="550" y="350" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">L3-Cache (geteilt, MiB):</text>
  <text x="550" y="370" text-anchor="middle" fill="#cbd5e1" font-size="12.5">für alle Kerne gemeinsam (Puffer zum RAM)</text>

  <rect x="745" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="910" y="204" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">NUKLEUS 3 · SRAM vs. DRAM (RAM)</text>
  <line x1="770" y1="218" x2="1050" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="910" y="248" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">SRAM (für Caches):</text>
  <text x="910" y="268" text-anchor="middle" fill="#cbd5e1" font-size="12.5">sehr schnell, teuer, kein Refresh</text>
  <text x="910" y="300" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">DRAM / DDR4 / DDR5 (Hauptspeicher):</text>
  <text x="910" y="320" text-anchor="middle" fill="#cbd5e1" font-size="12.5">günstig, groß, braucht Refresh (flüchtig!)</text>
  <text x="910" y="352" text-anchor="middle" fill="#94a3b8" font-size="12.5">Dual-Channel (2× Bandbreite)</text>
  <text x="910" y="370" text-anchor="middle" fill="#94a3b8" font-size="12.5">ECC-RAM (Fehlerkorrektur für Server)</text>
</svg>
