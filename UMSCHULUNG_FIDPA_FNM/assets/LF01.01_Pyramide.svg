<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="410" rx="14" fill="#0f172a"/>

  <!-- Connectors -->
  <path d="M 550 112 L 550 142 L 190 142 L 190 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 142 L 910 142 L 910 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SPITZE (width 820, centered at 550 -> x=140..960) -->
  <rect x="140" y="24" width="820" height="88" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="550" y="52" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">SPITZE · KERNAUSSAGE</text>
  <text x="550" y="78" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Duale IT-Ausbildung: FIDPA löst Daten- &amp; Prozessanforderungen</text>
  <text x="550" y="99" text-anchor="middle" fill="#bfdbfe" font-size="13">(Gestreckte IHK-Prüfung: 20 % AP1 + 80 % AP2)</text>

  <!-- NUKLEUS 1 (x=25..355, width=330, center=190) -->
  <rect x="25" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="190" y="204" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">NUKLEUS 1 · EDV &amp; INFORMATIK</text>
  <line x1="50" y1="218" x2="330" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="190" y="244" text-anchor="middle" fill="#f1f5f9" font-size="13.5" font-weight="600">Daten sammeln, speichern, ändern</text>
  <text x="190" y="276" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="600">4 Stufen der EDV:</text>
  <text x="190" y="298" text-anchor="middle" fill="#94a3b8" font-size="12.5">manuell → mechanisch →</text>
  <text x="190" y="317" text-anchor="middle" fill="#94a3b8" font-size="12.5">elektrisch → elektronisch</text>
  <text x="190" y="352" text-anchor="middle" fill="#cbd5e1" font-size="12.5">4 Zweige: theoretisch · technisch</text>
  <text x="190" y="370" text-anchor="middle" fill="#cbd5e1" font-size="12.5">praktisch · angewandt</text>

  <!-- NUKLEUS 2 (x=385..715, width=330, center=550) -->
  <rect x="385" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="204" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">NUKLEUS 2 · ROLLE FIDPA</text>
  <line x1="410" y1="218" x2="690" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="550" y="244" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">FIDPA (Daten &amp; Prozesse):</text>
  <text x="550" y="266" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Big Data, Datenqualität, ML/Statistik</text>
  <text x="550" y="286" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Geschäftsprozesse optimieren</text>
  <text x="550" y="320" text-anchor="middle" fill="#94a3b8" font-size="12.5" font-weight="600">Abgrenzung:</text>
  <text x="550" y="342" text-anchor="middle" fill="#94a3b8" font-size="12.5">FIAE (Software) · FISI (Infra/DevOps)</text>
  <text x="550" y="362" text-anchor="middle" fill="#94a3b8" font-size="12.5">FIDV (Industrie 4.0) · Systemelektr.</text>

  <!-- NUKLEUS 3 (x=745..1075, width=330, center=910) -->
  <rect x="745" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="910" y="204" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">NUKLEUS 3 · IHK-PRÜFUNG</text>
  <line x1="770" y1="218" x2="1050" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="910" y="244" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">AP1 (20 %): 90 Min. Arbeitsplatz</text>
  <text x="910" y="276" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">AP2 (80 %):</text>
  <text x="910" y="300" text-anchor="middle" fill="#cbd5e1" font-size="12.5">• 50 % Projekt (40 Std. + 30 Min. FG)</text>
  <text x="910" y="322" text-anchor="middle" fill="#cbd5e1" font-size="12.5">• 10 % Prozessanalyse (90 Min.)</text>
  <text x="910" y="344" text-anchor="middle" fill="#cbd5e1" font-size="12.5">• 10 % Datenqualität (90 Min.)</text>
  <text x="910" y="366" text-anchor="middle" fill="#cbd5e1" font-size="12.5">• 10 % WiSo (60 Min., meist MC)</text>
</svg>
