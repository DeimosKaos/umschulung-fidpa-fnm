<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410">
  <rect width="1100" height="410" fill="#0f172a" rx="14"/>
  <text x="550" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">LF 3.01 – Netzwerke: Vermittlungsprinzip &amp; Internet-Historie</text>
  <text x="550" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Warum Paketvermittlung das Telefon-Prinzip ablöste und wie aus dem ARPANET das WWW wurde (Kersken 5.1)</text>

  <!-- Top Left: Schaltkreisvermittlung -->
  <rect x="48" y="80" width="485" height="145" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <text x="290" y="106" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">Schaltkreisvermittlung (Circuit Switching)</text>
  <text x="68" y="132" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">• Feste Punkt-zu-Punkt-Leitung für die gesamte Dauer</text>
  <text x="68" y="154" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">• Echtzeit &amp; feste Reihenfolge (klassisches Telefonnetz)</text>
  <text x="68" y="176" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">• Leitung bleibt belegt, bis Verbindung abgebaut wird</text>
  <text x="68" y="200" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Hinweis: Modernes VoIP nutzt intern bereits Paketvermittlung.</text>

  <!-- Top Right: Paketvermittlung -->
  <rect x="567" y="80" width="485" height="145" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="809" y="106" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">Paketvermittlung (Packet Switching)</text>
  <text x="587" y="132" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">• Keine direkte Leitung; Daten in kleinere Pakete zerlegt</text>
  <text x="587" y="154" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">• Jedes Paket trägt Absender- &amp; Empfängeradresse</text>
  <text x="587" y="176" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">• Router leiten jedes Paket einzeln auf günstigem Weg weiter</text>
  <text x="587" y="200" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Wichtig: Basis-Paketvermittlung garantiert weder Ankunft noch Reihenfolge!</text>

  <!-- Bottom Timeline -->
  <rect x="48" y="245" width="1004" height="145" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="550" y="271" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Historische Entwicklung: Vom Kalten Krieg zum World Wide Web &amp; LAN</text>

  <rect x="66" y="286" width="225" height="88" rx="7" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="178" y="307" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1969: ARPANET (USA)</text>
  <text x="178" y="326" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">4 Uni-Rechner; Ziel: Ausfall-</text>
  <text x="178" y="342" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">sicherheit &amp; Datensynchronisation</text>
  <text x="178" y="360" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Bald darauf: FTP &amp; Telnet</text>

  <rect x="313" y="286" width="225" height="88" rx="7" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="425" y="307" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1972 &amp; RFCs</text>
  <text x="425" y="326" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">Ray Tomlinson: 1. E-Mail</text>
  <text x="425" y="342" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">RFCs = offene, lizenzfreie</text>
  <text x="425" y="360" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Standards für alle Hersteller</text>

  <rect x="560" y="286" width="225" height="88" rx="7" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="672" y="307" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1980er: Internet &amp; DFÜ</text>
  <text x="672" y="326" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">MilNet getrennt; ARPANET +</text>
  <text x="672" y="342" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">NSFNet → Internet; PC-DFÜ:</text>
  <text x="672" y="360" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Akustikkoppler → Modem / BTX</text>

  <rect x="807" y="286" width="227" height="88" rx="7" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="920" y="307" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1989/91: WWW &amp; LAN</text>
  <text x="920" y="326" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">Tim Berners-Lee (CERN):</text>
  <text x="920" y="342" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">HTTP + HTML + Browser</text>
  <text x="920" y="360" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Büro: Sneakernet → Ethernet</text>
</svg>
