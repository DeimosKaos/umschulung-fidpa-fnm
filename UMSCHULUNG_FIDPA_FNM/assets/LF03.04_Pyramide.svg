<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410">
  <rect width="1100" height="410" fill="#0f172a" rx="14"/>
  <text x="550" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">LF 3.04 – Netzwerkkarten, Kabel &amp; Ethernet-Standards</text>
  <text x="550" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">IEEE 802.3, 48-Bit-MAC, CSMA/CD, Twisted-Pair-Kategorien, Switch vs. Hub &amp; VLAN (Kersken 5.4)</text>

  <!-- Col 1: MAC & CSMA/CD -->
  <rect x="48" y="80" width="318" height="308" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="207" y="106" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">1. MAC-Adresse &amp; CSMA/CD</text>
  <rect x="66" y="122" width="282" height="72" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="143" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">48-Bit-MAC (IEEE 802.3, Schicht 2)</text>
  <text x="80" y="162" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 6 Hex-Blöcke (z. B. 00-A0-C9-E8-5F-64)</text>
  <text x="80" y="179" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Lokal im Segment; Promiscuous Mode snifft</text>

  <rect x="66" y="204" width="282" height="164" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="226" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Netzzugang: CSMA/CD</text>
  <text x="80" y="248" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">1. Carrier Sense: Medium abhören</text>
  <text x="80" y="268" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">2. Multiple Access: Senden, wenn frei</text>
  <text x="80" y="288" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">3. Collision Detection: Jam Signal senden</text>
  <text x="80" y="308" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">4. Zufällige Wartezeit vor Neustart</text>
  <text x="80" y="336" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11">Problem bei hoher Last: Kollisionen!</text>
  <text x="80" y="352" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Lösung: Switches statt Hubs / Segmentierung</text>

  <!-- Col 2: Kabel & Standards -->
  <rect x="391" y="80" width="318" height="308" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="106" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">2. Kabel &amp; Ethernet-Standards</text>
  <rect x="409" y="122" width="282" height="92" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="423" y="143" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Twisted Pair (RJ-45 Stecker)</text>
  <text x="423" y="162" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Verdrillte Adernpaare gegen Störfelder</text>
  <text x="423" y="180" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• UTP (ungeschirmt) vs. STP (geschirmt)</text>
  <text x="423" y="198" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Crosslink-Kabel: 2 PCs direkt ohne Switch</text>

  <rect x="409" y="224" width="282" height="144" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="423" y="246" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Kategorien &amp; Raten</text>
  <text x="423" y="267" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Cat 3 (10 MHz) → 10BaseT (10 MBit/s)</text>
  <text x="423" y="286" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Cat 5 (100 MHz) → 100BaseTX (Fast)</text>
  <text x="423" y="305" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Cat 6 (200 MHz) / Cat 7 (600 MHz)</text>
  <text x="423" y="324" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Gigabit: 1000BaseTX / 1000BaseFL (LWL)</text>
  <text x="423" y="344" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Heute auch 10 GBit/s, 100 GBit/s+</text>

  <!-- Col 3: Hub vs Switch & VLAN -->
  <rect x="734" y="80" width="318" height="308" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="893" y="106" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">3. Hub vs. Switch &amp; VLAN</text>
  <rect x="752" y="122" width="282" height="122" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="766" y="143" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Verteiler im Vergleich</text>
  <text x="766" y="163" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Hub: logischer Bus, alle teilen Bandbreite,</text>
  <text x="774" y="179" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Kollisionen möglich</text>
  <text x="766" y="199" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Switch: speichert MACs, Punkt-zu-Punkt,</text>
  <text x="774" y="215" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11">volle Rate pro Verbindung + Uplink-Port</text>
  <text x="766" y="233" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Bridge: verbindet versch. Ethernet-Typen</text>

  <rect x="752" y="254" width="282" height="114" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="766" y="276" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Virtual LAN (VLAN)</text>
  <text x="766" y="297" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Portbasiert: physische Switch-Ports</text>
  <text x="774" y="313" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">einzelnen Segmenten zuweisen</text>
  <text x="766" y="334" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Tagged VLAN: Pakete selbst markiert</text>
  <text x="774" y="350" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">→ verbindet Segmente über mehrere Switches</text>
</svg>
