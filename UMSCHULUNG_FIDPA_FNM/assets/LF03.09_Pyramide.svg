<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410">
  <rect width="1100" height="410" fill="#0f172a" rx="14"/>
  <text x="550" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">LF 3.09 – DNS &amp; Internetanwendungsprotokolle</text>
  <text x="550" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Namensauflösung (DNS), Remote-Shell (SSH/Telnet), Dateiübertragung (FTP), E-Mail (SMTP/MIME/POP3/IMAP) &amp; Web (Kersken 5.6.4–5.6.5)</text>

  <!-- Col 1: DNS -->
  <rect x="48" y="80" width="318" height="308" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="207" y="106" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">1. Domain Name System (DNS)</text>

  <rect x="66" y="122" width="282" height="106" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="142" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Von hosts-Datei zu DNS (RFC 1034)</text>
  <text x="80" y="161" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Lokal zuerst /etc/hosts (Phishing-Filter)</text>
  <text x="80" y="179" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Hierarchie rechts→links: www.firma.de</text>
  <text x="80" y="197" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Root-Zone („“) → TLD → Second-Level</text>
  <text x="80" y="214" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• gTLD (.com, .org) vs. ccTLD (.de, .uk)</text>

  <rect x="66" y="236" width="282" height="132" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="256" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Zonen, Redundanz &amp; Caching</text>
  <text x="80" y="276" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Software: BIND unter Unix</text>
  <text x="80" y="295" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Mind. 2 unabhängige Nameserver:</text>
  <text x="88" y="311" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Primärer Master + replizierender Slave</text>
  <text x="80" y="331" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Resolver-Cache speichert IPs temporär</text>

  <!-- Col 2: SSH, FTP, HTTP -->
  <rect x="391" y="80" width="318" height="308" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="106" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">2. SSH/Telnet, FTP &amp; WWW</text>

  <rect x="409" y="122" width="282" height="88" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="423" y="142" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Telnet (23) vs. SSH (22)</text>
  <text x="423" y="161" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Telnet = Klartext; SSH = verschlüsselt</text>
  <text x="423" y="179" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• GUI fern? Lokaler X-Server auf Client!</text>
  <text x="423" y="196" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• telnet-Tool testet auch Ports manuell</text>

  <rect x="409" y="218" width="282" height="84" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="423" y="238" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">FTP / SFTP / FTPS (Klartext-Befehle)</text>
  <text x="423" y="257" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• pwd, cd, ls, get, put, quit</text>
  <text x="423" y="275" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11">• ASCII-Modus (LF/CR) zerstört Binärdaten!</text>
  <text x="423" y="291" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">→ Für Bilder/Programme: binary nutzen</text>

  <rect x="409" y="310" width="282" height="58" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="423" y="330" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">WWW: HTTP 1.1 + URL + HTML</text>
  <text x="423" y="349" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Browser lädt HTML + eingebettete Medien</text>

  <!-- Col 3: E-Mail & MIME -->
  <rect x="734" y="80" width="318" height="308" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="893" y="106" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">3. E-Mail: SMTP, MIME, POP3/IMAP</text>

  <rect x="752" y="122" width="282" height="84" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="766" y="142" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">SMTP (Versand, Port 25)</text>
  <text x="766" y="161" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Befehle: HELO, MAIL, RCPT, DATA (.), QUIT</text>
  <text x="766" y="179" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Auth: User/Passwort (oder IP / SMTP-after-POP)</text>

  <rect x="752" y="214" width="282" height="90" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="766" y="234" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">MIME (Anhänge &amp; Formate)</text>
  <text x="766" y="253" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• multipart/mixed (Attachments)</text>
  <text x="766" y="271" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• multipart/alternative (Text + HTML)</text>
  <text x="766" y="289" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• base64 (Binär) / quoted-printable</text>

  <rect x="752" y="312" width="282" height="56" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="766" y="332" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Abholen: POP3 vs. IMAP4</text>
  <text x="766" y="351" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• POP3 (RETR+DELE) vs. IMAP (Server-Ordner)</text>
</svg>
