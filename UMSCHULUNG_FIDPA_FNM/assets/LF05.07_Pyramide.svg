<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" height="100%" style="background:#0f172a;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Spitze -->
  <rect x="140" y="18" width="820" height="96" rx="12" fill="url(#gTop)" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="550" y="47" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1.2">SPITZE · KERNPROBLEM &amp; ZIEL (LF 5.07)</text>
  <text x="550" y="74" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Vernetzte &amp; hierarchische Daten: Bäume und Graphen</text>
  <text x="550" y="98" text-anchor="middle" fill="#cbd5e1" font-size="13.5">Binäre Suchbäume für Sortierung/Hierarchie sowie Graphen (V, E) für Netze &amp; Routing</text>

  <!-- Verbindungslinien -->
  <path d="M550 114 L195 148 M550 114 L550 148 M550 114 L905 148" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Nukleus 1 -->
  <rect x="30" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#818cf8" stroke-width="2"/>
  <text x="195" y="176" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 1 · BÄUME &amp; BINÄRBAUM</text>
  <line x1="55" y1="188" x2="335" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Baum-Struktur:</text>
  <text x="55" y="234" fill="#cbd5e1" font-size="12.5">• Wurzel (Root) ohne Vorgänger</text>
  <text x="55" y="253" fill="#cbd5e1" font-size="12.5">• Jeder Knoten: max. 1 Vorgänger,</text>
  <text x="55" y="270" fill="#cbd5e1" font-size="12.5">  aber mehrere Nachfolger (kein Zyklus!)</text>
  <text x="55" y="298" fill="#f1f5f9" font-size="13.5" font-weight="600">Sortierter Binärbaum (max. 2 Kinder):</text>
  <text x="55" y="318" fill="#38bdf8" font-size="12.5">• Links: &lt;= Knoten · Rechts: &gt; Knoten</text>
  <text x="55" y="337" fill="#38bdf8" font-size="12.5">• In-Order (Links-Wert-Rechts) = sortiert!</text>
  <text x="55" y="358" fill="#94a3b8" font-size="12">Ideal für Dateisysteme, Org-Charts, PQ</text>

  <!-- Nukleus 2 -->
  <rect x="385" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="176" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 2 · GRAPHEN (V, E)</text>
  <line x1="410" y1="188" x2="690" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="410" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Grundbegriffe &amp; Varianten:</text>
  <text x="410" y="234" fill="#cbd5e1" font-size="12.5">• Vertices V (Knoten) + Edges E (Kanten)</text>
  <text x="410" y="253" fill="#cbd5e1" font-size="12.5">• Zyklen &amp; mehrere Vorgänger erlaubt</text>
  <text x="410" y="272" fill="#cbd5e1" font-size="12.5">• Ungerichtet (bidir.) vs. Digraph (Pfeil)</text>
  <text x="410" y="291" fill="#cbd5e1" font-size="12.5">• Multigraph &amp; gewichteter Graph (Kosten)</text>
  <text x="410" y="318" fill="#f1f5f9" font-size="13.5" font-weight="600">Anwendungen:</text>
  <text x="410" y="338" fill="#34d399" font-size="12.5">• Routing, ÖPNV-Netze, Social Graphs</text>
  <text x="410" y="357" fill="#34d399" font-size="12.5">• Suche via DFS (Pfad) / BFS (kürzester)</text>

  <!-- Nukleus 3 -->
  <rect x="740" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#fbbf24" stroke-width="2"/>
  <text x="905" y="176" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 3 · PRAXIS &amp; IHK-FALLE</text>
  <line x1="765" y1="188" x2="1045" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="765" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Sauberes Löschen im Graph:</text>
  <text x="765" y="234" fill="#cbd5e1" font-size="12.5">• Erst alle Kanten des Knotens löschen,</text>
  <text x="765" y="251" fill="#cbd5e1" font-size="12.5">  dann den Knoten selbst entfernen!</text>
  <text x="765" y="270" fill="#cbd5e1" font-size="12.5">• Gelöschte IDs nie neu vergeben</text>
  <text x="765" y="300" fill="#f87171" font-size="13.5" font-weight="600">Typische IHK-Fallen:</text>
  <text x="765" y="320" fill="#fca5a5" font-size="12.5">• Jeder Baum ist ein Graph, aber ein</text>
  <text x="765" y="337" fill="#fca5a5" font-size="12.5">  Graph mit Zyklus ist KEIN Baum!</text>
  <text x="765" y="356" fill="#fca5a5" font-size="12.5">• Bei DFS vs. BFS in Bäumen: BFS</text>
  <text x="765" y="373" fill="#fca5a5" font-size="12.5">  geht ebenenweise, DFS tiefenweise!</text>
</svg>
