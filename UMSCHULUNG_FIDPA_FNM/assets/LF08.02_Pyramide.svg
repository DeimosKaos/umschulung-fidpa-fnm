<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="spitzeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="410" rx="14" fill="url(#bgGrad)"/>
  <text x="550" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.2">PYRAMIDENSCHEMA® · LF 8.02: JAVA TEIL 1: GRUNDLAGEN, SYNTAX &amp; MERKMALE</text>

  <rect x="140" y="45" width="820" height="86" rx="12" fill="url(#spitzeGrad)" opacity="0.92"/>
  <rect x="140" y="45" width="820" height="86" rx="12" fill="none" stroke="#a5f3fc" stroke-width="1.5"/>
  <text x="550" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#e0f2fe" letter-spacing="1">SPITZE (KERNAUSSAGE)</text>
  <text x="550" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Java kompiliert Quellcode in Bytecode für die JVM und erzwingt</text>
  <text x="550" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">strenge statische Typisierung, String-Vergleiche per equals() und feste Arrays.</text>

  <line x1="550" y1="131" x2="550" y2="155" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="155" x2="900" y2="155" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="155" x2="200" y2="175" stroke="#475569" stroke-width="2"/>
  <line x1="550" y1="155" x2="550" y2="175" stroke="#475569" stroke-width="2"/>
  <line x1="900" y1="155" x2="900" y2="175" stroke="#475569" stroke-width="2"/>

  <rect x="35" y="175" width="330" height="210" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="35" y="175" width="330" height="42" rx="12" fill="#4c1d95" opacity="0.7"/>
  <text x="200" y="201" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ddd6fe">Nukleus 1: JVM &amp; Bytecode</text>
  <text x="56" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• .java -&gt; javac -&gt; .class (Bytecode)</text>
  <text x="56" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• JVM führt Bytecode plattformfrei</text>
  <text x="56" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• JDK (Entwicklung) vs. JRE (Laufzeit)</text>
  <text x="56" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Dateiname == public class Name</text>
  <text x="56" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• main(String[] args) als Einstieg</text>

  <rect x="385" y="175" width="330" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="385" y="175" width="330" height="42" rx="12" fill="#064e3b" opacity="0.7"/>
  <text x="550" y="201" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">Nukleus 2: Typen &amp; Strings</text>
  <text x="406" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Primitiv: int, double, boolean, char</text>
  <text x="406" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Streng statisch typisiert</text>
  <text x="406" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Integer-Division: 5 / 2 == 2!</text>
  <text x="406" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• String ist Klasse (Referenztyp)</text>
  <text x="406" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Vergleich: .equals() statt == !</text>

  <rect x="735" y="175" width="330" height="210" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <rect x="735" y="175" width="330" height="42" rx="12" fill="#164e63" opacity="0.7"/>
  <text x="900" y="201" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#a5f3fc">Nukleus 3: Ablauf &amp; Arrays</text>
  <text x="756" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• if/else, switch (break-Falle!)</text>
  <text x="756" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• for, while, do-while (mind. 1x)</text>
  <text x="756" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Array: int[] a = new int[5];</text>
  <text x="756" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• a.length vs. str.length()</text>
  <text x="756" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Jede Anweisung endet mit ;</text>
</svg>