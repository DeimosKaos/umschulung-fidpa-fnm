<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="410" rx="14" fill="#0f172a"/>
  <path d="M 550 112 L 550 142 L 190 142 L 190 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 142 L 910 142 L 910 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="24" width="820" height="88" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="550" y="52" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">SPITZE · KERNAUSSAGE</text>
  <text x="550" y="78" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Der Kernel abstrahiert Hardware und teilt CPU, RAM &amp; Speicher fair auf</text>
  <text x="550" y="99" text-anchor="middle" fill="#bfdbfe" font-size="13">(Kernel Mode schützt Hardware · Prozesse laufen isoliert · Dateisystem strukturiert Daten)</text>

  <rect x="25" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="190" y="204" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">NUKLEUS 1 · KERNEL &amp; MODI</text>
  <line x1="50" y1="218" x2="330" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="190" y="248" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Kernel Mode vs. User Mode:</text>
  <text x="190" y="268" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Apps nutzen System Calls statt</text>
  <text x="190" y="288" text-anchor="middle" fill="#cbd5e1" font-size="12.5">direktem Hardware-Zugriff</text>
  <text x="190" y="322" text-anchor="middle" fill="#94a3b8" font-size="12.5">Monolithisch (Linux: schnell)</text>
  <text x="190" y="344" text-anchor="middle" fill="#94a3b8" font-size="12.5">vs. Mikrokernel (minimal, isoliert)</text>

  <rect x="385" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="204" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">NUKLEUS 2 · PROZESSE &amp; RAM</text>
  <line x1="410" y1="218" x2="690" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="550" y="248" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Prozess (eigener RAM) vs. Thread</text>
  <text x="550" y="272" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Scheduler: Multitasking (Time-Slice)</text>
  <text x="550" y="304" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Virtueller Speicher:</text>
  <text x="550" y="326" text-anchor="middle" fill="#cbd5e1" font-size="12.5">MMU + Paging (Pages ↔ Frames)</text>
  <text x="550" y="348" text-anchor="middle" fill="#94a3b8" font-size="12.5">Swapping auf Disk bei RAM-Mangel</text>

  <rect x="745" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="910" y="204" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">NUKLEUS 3 · DATEISYSTEME</text>
  <line x1="770" y1="218" x2="1050" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="910" y="248" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Ordnerbaum + Metadaten:</text>
  <text x="910" y="268" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Inodes (Linux) · MFT (NTFS)</text>
  <text x="910" y="302" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Journaling (NTFS, ext4):</text>
  <text x="910" y="324" text-anchor="middle" fill="#cbd5e1" font-size="12.5">protokolliert Änderungen vorher</text>
  <text x="910" y="346" text-anchor="middle" fill="#94a3b8" font-size="12.5">→ schützt bei Stromausfall/Crash</text>
</svg>
