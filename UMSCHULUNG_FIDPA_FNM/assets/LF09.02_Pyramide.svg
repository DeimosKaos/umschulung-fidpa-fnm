<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="spitzeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="410" rx="14" fill="url(#bgGrad)"/>
  <text x="550" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.2">PYRAMIDENSCHEMA® · LF 9.02: SWITCHING, VLANS, ETHERNET &amp; ROUTING</text>

  <rect x="140" y="45" width="820" height="86" rx="12" fill="url(#spitzeGrad)" opacity="0.92"/>
  <rect x="140" y="45" width="820" height="86" rx="12" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="550" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#bae6fd" letter-spacing="1">SPITZE (KERNAUSSAGE)</text>
  <text x="550" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Switches trennen Kollisionsdomänen per MAC-Tabelle (Layer 2), VLANs trennen</text>
  <text x="550" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Broadcast-Domänen (802.1Q) und Router verbinden Subnetze per IP (Layer 3).</text>

  <line x1="550" y1="131" x2="550" y2="155" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="155" x2="900" y2="155" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="155" x2="200" y2="175" stroke="#475569" stroke-width="2"/>
  <line x1="550" y1="155" x2="550" y2="175" stroke="#475569" stroke-width="2"/>
  <line x1="900" y1="155" x2="900" y2="175" stroke="#475569" stroke-width="2"/>

  <rect x="35" y="175" width="330" height="210" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="35" y="175" width="330" height="42" rx="12" fill="#1e3a8a" opacity="0.7"/>
  <text x="200" y="201" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#93c5fd">Nukleus 1: Ethernet &amp; Switch</text>
  <text x="56" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• IEEE 802.3, MAC = 48 Bit Hardware</text>
  <text x="56" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Switch lernt MACs in CAM-Table</text>
  <text x="56" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• 1 Port = 1 Kollisionsdomäne</text>
  <text x="56" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Vollduplex -&gt; kein CSMA/CD mehr</text>
  <text x="56" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Cat 6a/7 (Kupfer) vs. LWL (Backbone)</text>

  <rect x="385" y="175" width="330" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="385" y="175" width="330" height="42" rx="12" fill="#064e3b" opacity="0.7"/>
  <text x="550" y="201" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">Nukleus 2: VLANs (802.1Q)</text>
  <text x="406" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Trennt Broadcast-Domänen logisch</text>
  <text x="406" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Access-Port: 1 VLAN (untagged)</text>
  <text x="406" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Trunk-Port: mehrere VLANs (tagged)</text>
  <text x="406" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• 802.1Q-Tag: 12-Bit VLAN-ID</text>
  <text x="406" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Zwischen VLANs: Router nötig!</text>

  <rect x="735" y="175" width="330" height="210" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="735" y="175" width="330" height="42" rx="12" fill="#78350f" opacity="0.7"/>
  <text x="900" y="201" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#fcd34d">Nukleus 3: IP &amp; Routing</text>
  <text x="756" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• IPv4 (32 Bit) / IPv6 (128 Bit)</text>
  <text x="756" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• CIDR /n -&gt; 2^(32-n) - 2 Hosts</text>
  <text x="756" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Fremdes Netz -&gt; Default Gateway</text>
  <text x="756" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Router prüft Routing-Tabelle</text>
  <text x="756" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• ARP löst IP -&gt; MAC im LAN auf</text>
</svg>