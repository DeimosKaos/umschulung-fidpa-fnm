<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="410" rx="14" fill="#0f172a"/>
  <path d="M 550 112 L 550 142 L 190 142 L 190 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 142 L 910 142 L 910 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="24" width="820" height="88" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="550" y="52" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">SPITZE · KERNAUSSAGE</text>
  <text x="550" y="78" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Computer speichern alle Daten als Bits (2er-Potenzen) in 8-Bit-Bytes</text>
  <text x="550" y="99" text-anchor="middle" fill="#bfdbfe" font-size="13">(Binär für Hardware · Hexadezimal für Menschen · kB vs. KiB für AP1-Berechnungen)</text>

  <rect x="25" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="190" y="204" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">NUKLEUS 1 · ZAHLENSYSTEME</text>
  <line x1="50" y1="218" x2="330" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="190" y="246" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">Dezimal (10) · Binär (2) · Hex (16)</text>
  <text x="190" y="276" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Binär → Dezimal: Stellenwerte addieren</text>
  <text x="190" y="298" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Dezimal → Binär: ÷ 2 mit Rest</text>
  <text x="190" y="330" text-anchor="middle" fill="#94a3b8" font-size="12.5">Hex (0–9, A–F): 1 Ziffer = 4 Bit</text>
  <text x="190" y="352" text-anchor="middle" fill="#94a3b8" font-size="12.5">1 Byte (8 Bit) = 2 Hex-Ziffern (00–FF)</text>

  <rect x="385" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="204" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">NUKLEUS 2 · BITS, BYTES &amp; SI/IEC</text>
  <line x1="410" y1="218" x2="690" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="550" y="246" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">1 Byte = 8 Bit (256 Werte: 0–255)</text>
  <text x="550" y="278" text-anchor="middle" fill="#cbd5e1" font-size="12.5">SI (Dezimal, × 1.000):</text>
  <text x="550" y="298" text-anchor="middle" fill="#94a3b8" font-size="12.5">kB, MB, GB (Festplatten &amp; Netze)</text>
  <text x="550" y="330" text-anchor="middle" fill="#cbd5e1" font-size="12.5">IEC (Binär, × 1.024):</text>
  <text x="550" y="350" text-anchor="middle" fill="#94a3b8" font-size="12.5">KiB, MiB, GiB (RAM &amp; Betriebssystem)</text>

  <rect x="745" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="910" y="204" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">NUKLEUS 3 · NEGATIVE ZAHLEN</text>
  <line x1="770" y1="218" x2="1050" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="910" y="246" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Zweierkomplement (Standard):</text>
  <text x="910" y="278" text-anchor="middle" fill="#cbd5e1" font-size="12.5">1. Alle Bits invertieren (0 ↔ 1)</text>
  <text x="910" y="300" text-anchor="middle" fill="#cbd5e1" font-size="12.5">2. + 1 addieren</text>
  <text x="910" y="334" text-anchor="middle" fill="#94a3b8" font-size="12.5">8 Bit mit Vorzeichen: −128 bis +127</text>
  <text x="910" y="356" text-anchor="middle" fill="#fbbf24" font-size="12.5" font-weight="600">Vorteil: Subtraktion = Addition</text>
</svg>
