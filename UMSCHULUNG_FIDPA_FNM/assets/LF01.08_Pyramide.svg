<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" height="100%" style="background:#0f172a;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Spitze -->
  <rect x="140" y="18" width="820" height="96" rx="12" fill="url(#gTop)" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="550" y="47" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1.2">SPITZE · KERNPROBLEM &amp; ZIEL (LF 1.08)</text>
  <text x="550" y="74" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Prozesse statt Silos: Abläufe transparent modellieren</text>
  <text x="550" y="98" text-anchor="middle" fill="#cbd5e1" font-size="13.5">Vom Taylorismus zur digitalen Prozesssteuerung mit BPMN 2.0 &amp; ERP/CRM</text>

  <!-- Verbindungslinien -->
  <path d="M550 114 L195 148 M550 114 L550 148 M550 114 L905 148" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Nukleus 1 -->
  <rect x="30" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#818cf8" stroke-width="2"/>
  <text x="195" y="176" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 1 · PROZESSORIENTIERUNG</text>
  <line x1="55" y1="188" x2="335" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Taylorismus (Funktional):</text>
  <text x="55" y="234" fill="#94a3b8" font-size="12.5">• Starre Abteilungen, lange Liegezeiten</text>
  <text x="55" y="253" fill="#94a3b8" font-size="12.5">• Zuständigkeitslücken &amp; Medienbrüche</text>
  <text x="55" y="282" fill="#f1f5f9" font-size="13.5" font-weight="600">Prozessorientierung &amp; 3 Achsen:</text>
  <text x="55" y="302" fill="#cbd5e1" font-size="12.5">• Ebenen (Strategie bis Workflow)</text>
  <text x="55" y="321" fill="#cbd5e1" font-size="12.5">• Phasen (Planen → Steuern → Prüfen)</text>
  <text x="55" y="340" fill="#cbd5e1" font-size="12.5">• Sichten (Daten, Funktion, Orga)</text>
  <text x="55" y="366" fill="#38bdf8" font-size="12" font-weight="600">Ziel: Durchlaufzeit &amp; Qualität optimieren</text>

  <!-- Nukleus 2 -->
  <rect x="385" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="176" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 2 · BPMN 2.0 ELEMENTE</text>
  <line x1="410" y1="188" x2="690" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="410" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Akteure &amp; Fluss:</text>
  <text x="410" y="234" fill="#cbd5e1" font-size="12.5">• Pool = Organisation / Prozessgrenze</text>
  <text x="410" y="253" fill="#cbd5e1" font-size="12.5">• Lane = Rolle / Abteilung im Pool</text>
  <text x="410" y="272" fill="#cbd5e1" font-size="12.5">• Ereignis (Kreis): Start, Timer, Ende</text>
  <text x="410" y="291" fill="#cbd5e1" font-size="12.5">• Aktivität (abgerundet): Task / Skript</text>
  <text x="410" y="318" fill="#f1f5f9" font-size="13.5" font-weight="600">Gateways (Rauten):</text>
  <text x="410" y="338" fill="#34d399" font-size="12.5">• X = Exklusiv (XOR: genau 1 Pfad)</text>
  <text x="410" y="357" fill="#34d399" font-size="12.5">• + = Parallel (AND) · O = Inklusiv (OR)</text>

  <!-- Nukleus 3 -->
  <rect x="740" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#fbbf24" stroke-width="2"/>
  <text x="905" y="176" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 3 · PRAXIS &amp; IHK-FALLE</text>
  <line x1="765" y1="188" x2="1045" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="765" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">IT-Systeme im Betrieb:</text>
  <text x="765" y="234" fill="#cbd5e1" font-size="12.5">• ERP: Finanzen, Lager, Einkauf zentral</text>
  <text x="765" y="253" fill="#cbd5e1" font-size="12.5">• CRM: Kunden, Leads, Support steuern</text>
  <text x="765" y="272" fill="#cbd5e1" font-size="12.5">• Alternativen: EPK, UML-Aktivität</text>
  <text x="765" y="302" fill="#f87171" font-size="13.5" font-weight="600">Typische IHK-Fallen:</text>
  <text x="765" y="322" fill="#fca5a5" font-size="12.5">• Sequenzfluss (durchgezogen) nur</text>
  <text x="765" y="339" fill="#fca5a5" font-size="12.5">  innerhalb eines Pools; Nachrichtenfluss</text>
  <text x="765" y="356" fill="#fca5a5" font-size="12.5">  (gestrichelt) nur zwischen Pools!</text>
</svg>
