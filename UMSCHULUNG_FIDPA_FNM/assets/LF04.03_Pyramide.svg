<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410">
  <rect width="1100" height="410" fill="#0f172a" rx="14"/>
  <text x="550" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">LF 4.03 – BSI IT-Grundschutz &amp; ISO/IEC 27001</text>
  <text x="550" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Wie ein ISMS systematisch über den PDCA-Zyklus aufgebaut, gesteuert und zertifiziert wird</text>

  <!-- Col 1: PDCA -->
  <rect x="48" y="80" width="318" height="308" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="207" y="106" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">1. ISMS &amp; PDCA-Zyklus</text>

  <rect x="66" y="122" width="282" height="58" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="143" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">PLAN (Planen)</text>
  <text x="80" y="162" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Ist-Analyse, Schutzbedarf, Risiko, Ziele</text>

  <rect x="66" y="188" width="282" height="58" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="209" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">DO (Umsetzen)</text>
  <text x="80" y="228" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Maßnahmen einführen, Team schulen</text>

  <rect x="66" y="254" width="282" height="58" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="275" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">CHECK (Prüfen)</text>
  <text x="80" y="294" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Audits, Soll-Ist-Vergleich, Monitoring</text>

  <rect x="66" y="320" width="282" height="52" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="341" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">ACT (Verbessern)</text>
  <text x="80" y="359" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Mängel beheben, ISMS stetig anpassen</text>

  <!-- Col 2: BSI-Standards -->
  <rect x="391" y="80" width="330" height="308" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="556" y="106" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">2. BSI-Standards (200-x)</text>

  <rect x="409" y="122" width="294" height="62" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="423" y="142" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">BSI-Standard 200-1</text>
  <text x="423" y="162" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Allgemeine Anforderungen an ein ISMS</text>
  <text x="423" y="177" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">(kompatibel zu ISO/IEC 27001)</text>

  <rect x="409" y="192" width="294" height="94" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="423" y="212" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">BSI-Standard 200-2 (Methodik)</text>
  <text x="423" y="231" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">3 Absicherungsstufen für die Praxis:</text>
  <text x="423" y="249" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Basis (KMU-Einstieg) | • Standard (breit)</text>
  <text x="423" y="267" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Kern (Fokus auf kritische „Kronjuwelen“)</text>

  <rect x="409" y="294" width="294" height="78" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="423" y="314" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">BSI 200-3 &amp; 200-4</text>
  <text x="423" y="333" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 200-3: Risikoanalyse bei hohem Bedarf</text>
  <text x="423" y="352" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 200-4: Business Continuity / Notfall</text>

  <!-- Col 3: BSI vs ISO -->
  <rect x="746" y="80" width="306" height="308" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="899" y="106" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">3. BSI vs. ISO/IEC 27001</text>

  <rect x="764" y="122" width="270" height="114" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="778" y="143" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">ISO/IEC 27001 (International)</text>
  <text x="778" y="163" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Weltweiter Zertifizierungsstandard</text>
  <text x="778" y="181" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Definiert WAS nötig ist, lässt das</text>
  <text x="786" y="198" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">WIE aber vergleichsweise offen</text>

  <rect x="764" y="246" width="270" height="126" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="778" y="267" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">BSI IT-Grundschutz-Kompendium</text>
  <text x="778" y="287" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Konkrete Bausteine &amp; Checklisten</text>
  <text x="778" y="305" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Standard- oder Kern-Absicherung</text>
  <text x="778" y="323" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">  ermöglicht „ISO 27001 auf Basis</text>
  <text x="778" y="340" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">  von IT-Grundschutz“!</text>
</svg>
