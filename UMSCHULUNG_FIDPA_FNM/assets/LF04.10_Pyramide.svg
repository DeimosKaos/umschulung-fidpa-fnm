<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410">
  <rect width="1100" height="410" fill="#0f172a" rx="14"/>
  <text x="550" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">LF 4.10 – Backup-Strategien, Notfallmanagement &amp; Richtlinien</text>
  <text x="550" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">3-2-1-Regel, Backup-Arten (Voll/Diff/Inkrementell), RPO/RTO &amp; Sicherheitsrichtlinien</text>

  <!-- Col 1: 3-2-1 & Backup-Arten -->
  <rect x="48" y="80" width="328" height="308" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="212" y="106" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">1. Backup-Strategien</text>

  <rect x="66" y="122" width="292" height="92" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="142" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Die 3-2-1-Backup-Regel</text>
  <text x="80" y="161" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 3 Datenkopien (Original + 2 Backups)</text>
  <text x="80" y="179" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 2 unterschiedliche Medien (z. B. NAS + Tape)</text>
  <text x="80" y="197" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 1 Kopie außer Haus / offline (Ransomware!)</text>

  <rect x="66" y="222" width="292" height="150" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="242" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3 Sicherungsarten im Vergleich</text>
  <text x="80" y="262" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Vollbackup: alles; langsam, Restore schnell</text>
  <text x="80" y="282" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Differentiell: alles seit letztem Vollbackup</text>
  <text x="88" y="298" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">(Restore = Vollbackup + letztes Diff.)</text>
  <text x="80" y="318" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Inkrementell: nur seit letzter Sicherung</text>
  <text x="88" y="334" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">(schnell, Restore braucht ganze Kette!)</text>

  <!-- Col 2: Notfallmanagement (BCM) -->
  <rect x="394" y="80" width="328" height="308" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="558" y="106" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">2. Notfallmanagement (BSI 200-4)</text>

  <rect x="412" y="122" width="292" height="114" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="426" y="142" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Die 2 wichtigsten Kennzahlen</text>
  <text x="426" y="163" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• RPO (Recovery Point Objective):</text>
  <text x="434" y="179" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Wie alt darf das Backup sein? (Datenverlust)</text>
  <text x="426" y="199" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• RTO (Recovery Time Objective):</text>
  <text x="434" y="215" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Wie schnell muss System wieder laufen?</text>

  <rect x="412" y="244" width="292" height="128" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="426" y="264" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Wiederanlauf &amp; Datenbanken</text>
  <text x="426" y="284" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• DB-Backup: konsistenter Dump (mysqldump)</text>
  <text x="426" y="303" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Regelmäßige Restore-Tests sind Pflicht!</text>
  <text x="426" y="322" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">(Ungetestetes Backup = kein Backup)</text>
  <text x="426" y="341" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Merke: RAID ersetzt KEIN Backup!</text>

  <!-- Col 3: Richtlinien & Orga -->
  <rect x="740" y="80" width="312" height="308" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="896" y="106" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">3. Sicherheitsrichtlinien</text>

  <rect x="758" y="122" width="276" height="250" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="772" y="144" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Verbindliche Regeln im Betrieb:</text>
  <text x="772" y="170" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Passwort- &amp; Rechte-Richtlinie</text>
  <text x="772" y="194" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Clean-Desk- &amp; Bildschirmsperr-Policy</text>
  <text x="772" y="218" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Umgang mit USB-Sticks &amp; Homeoffice</text>
  <text x="772" y="242" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Meldeweg bei Vorfällen (72h DSGVO!)</text>
  <text x="772" y="266" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Notfallhandbuch offline vorhalten</text>
  <text x="772" y="302" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Schließt Cluster 1 (LF 1–4) ab und bildet</text>
  <text x="772" y="318" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">die Basis für alle Prozesse in Cluster 2.</text>
</svg>
