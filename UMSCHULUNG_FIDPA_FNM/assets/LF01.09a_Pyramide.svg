<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="410" rx="14" fill="#0f172a"/>
  <path d="M 550 112 L 550 142 L 190 142 L 190 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 142 L 910 142 L 910 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="24" width="820" height="88" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="550" y="52" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">SPITZE · KERNAUSSAGE</text>
  <text x="550" y="78" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Formale Logik macht Entscheidungen für Computer eindeutig (1 oder 0)</text>
  <text x="550" y="99" text-anchor="middle" fill="#bfdbfe" font-size="13">(Aussagen bewerten → Bedingungen verknüpfen → sauber negieren mit De Morgan)</text>

  <rect x="25" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="190" y="204" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">NUKLEUS 1 · AUSSAGE vs. FORM</text>
  <line x1="50" y1="218" x2="330" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="190" y="248" text-anchor="middle" fill="#f1f5f9" font-size="13.5" font-weight="600">Aussage:</text>
  <text x="190" y="268" text-anchor="middle" fill="#cbd5e1" font-size="12.5">eindeutig wahr (1) oder falsch (0)</text>
  <text x="190" y="302" text-anchor="middle" fill="#f1f5f9" font-size="13.5" font-weight="600">Aussageform:</text>
  <text x="190" y="322" text-anchor="middle" fill="#cbd5e1" font-size="12.5">enthält Variable (z. B. x &gt; 3)</text>
  <text x="190" y="344" text-anchor="middle" fill="#94a3b8" font-size="12.5">wird durch Einsetzen zur Aussage</text>

  <rect x="385" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="204" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">NUKLEUS 2 · OPERATOREN</text>
  <line x1="410" y1="218" x2="690" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="550" y="246" text-anchor="middle" fill="#cbd5e1" font-size="12.5">¬A (NOT) · A ∧ B (beide 1)</text>
  <text x="550" y="270" text-anchor="middle" fill="#cbd5e1" font-size="12.5">A ∨ B (mind. eins 1)</text>
  <text x="550" y="294" text-anchor="middle" fill="#cbd5e1" font-size="12.5">A ⊕ B (XOR: genau eins 1)</text>
  <text x="550" y="324" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="600">A ⇒ B (Implikation):</text>
  <text x="550" y="344" text-anchor="middle" fill="#94a3b8" font-size="12.5">nur 1 ⇒ 0 ist falsch!</text>
  <text x="550" y="366" text-anchor="middle" fill="#94a3b8" font-size="12.5">A ⇔ B: beide Werte gleich</text>

  <rect x="745" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="910" y="204" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">NUKLEUS 3 · DE MORGAN</text>
  <line x1="770" y1="218" x2="1050" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="910" y="248" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">Klammer auflösen beim Negieren:</text>
  <text x="910" y="280" text-anchor="middle" fill="#cbd5e1" font-size="13">¬(A ∧ B) ⇔ ¬A ∨ ¬B</text>
  <text x="910" y="304" text-anchor="middle" fill="#cbd5e1" font-size="13">¬(A ∨ B) ⇔ ¬A ∧ ¬B</text>
  <text x="910" y="342" text-anchor="middle" fill="#94a3b8" font-size="12.5">Merksatz: ¬ reinziehen</text>
  <text x="910" y="362" text-anchor="middle" fill="#94a3b8" font-size="12.5">und ∧ ↔ ∨ umdrehen!</text>
</svg>
