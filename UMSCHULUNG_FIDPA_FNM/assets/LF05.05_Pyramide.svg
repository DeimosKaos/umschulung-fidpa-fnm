<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" height="100%" style="background:#0f172a;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Spitze -->
  <rect x="140" y="18" width="820" height="96" rx="12" fill="url(#gTop)" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="550" y="47" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1.2">SPITZE · KERNPROBLEM &amp; ZIEL (LF 5.05)</text>
  <text x="550" y="74" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">OOP &amp; Standardbibliothek: Daten + Verhalten sauber bündeln</text>
  <text x="550" y="98" text-anchor="middle" fill="#cbd5e1" font-size="13.5">Klassen, Vererbung, Exceptions, Module und Bordmittel (math, os, sys, re, datetime)</text>

  <!-- Verbindungslinien -->
  <path d="M550 114 L195 148 M550 114 L550 148 M550 114 L905 148" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Nukleus 1 -->
  <rect x="30" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#818cf8" stroke-width="2"/>
  <text x="195" y="176" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 1 · KLASSEN &amp; VERERBUNG</text>
  <line x1="55" y1="188" x2="335" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Kapselung &amp; Magic Methods:</text>
  <text x="55" y="234" fill="#cbd5e1" font-size="12.5">• class Name: + __init__(self, ...)</text>
  <text x="55" y="253" fill="#cbd5e1" font-size="12.5">• __str__ (Anzeige), __repr__ (Debug)</text>
  <text x="55" y="272" fill="#cbd5e1" font-size="12.5">• _intern (Konvention für privat)</text>
  <text x="55" y="300" fill="#f1f5f9" font-size="13.5" font-weight="600">Vererbung &amp; Funktionen:</text>
  <text x="55" y="320" fill="#cbd5e1" font-size="12.5">• class Kind(Eltern): + super().__init__</text>
  <text x="55" y="339" fill="#cbd5e1" font-size="12.5">• *args, **kwargs &amp; lambda x: ...</text>
  <text x="55" y="358" fill="#38bdf8" font-size="12.5">• Type-Hints (-> int) für mypy</text>

  <!-- Nukleus 2 -->
  <rect x="385" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="176" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 2 · EXCEPTIONS &amp; STDLIB</text>
  <line x1="410" y1="188" x2="690" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="410" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Fehler &amp; Module:</text>
  <text x="410" y="234" fill="#cbd5e1" font-size="12.5">• try / except Fehler: + raise</text>
  <text x="410" y="253" fill="#cbd5e1" font-size="12.5">• if __name__ == "__main__": Guard</text>
  <text x="410" y="280" fill="#f1f5f9" font-size="13.5" font-weight="600">5 wichtige Standardmodule:</text>
  <text x="410" y="300" fill="#cbd5e1" font-size="12.5">• math: sqrt, floor, ceil, gcd, inf</text>
  <text x="410" y="319" fill="#cbd5e1" font-size="12.5">• sys: argv[0] = Skript, argv[1..] Args</text>
  <text x="410" y="338" fill="#cbd5e1" font-size="12.5">• os: listdir, isfile, isdir, walk</text>
  <text x="410" y="357" fill="#cbd5e1" font-size="12.5">• re (Regex) &amp; datetime + timedelta</text>

  <!-- Nukleus 3 -->
  <rect x="740" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#fbbf24" stroke-width="2"/>
  <text x="905" y="176" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 3 · PRAXIS &amp; IHK-FALLE</text>
  <line x1="765" y1="188" x2="1045" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="765" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Sortieren &amp; Doku:</text>
  <text x="765" y="234" fill="#cbd5e1" font-size="12.5">• sorted(l, key=lambda...) -&gt; Kopie</text>
  <text x="765" y="253" fill="#cbd5e1" font-size="12.5">• l.sort() -&gt; in-place; pydoc</text>
  <text x="765" y="282" fill="#f87171" font-size="13.5" font-weight="600">Typische IHK-Fallen:</text>
  <text x="765" y="302" fill="#fca5a5" font-size="12.5">• Ohne __main__-Guard läuft Testcode</text>
  <text x="765" y="319" fill="#fca5a5" font-size="12.5">  ungewollt beim import mit!</text>
  <text x="765" y="338" fill="#fca5a5" font-size="12.5">• Type-Hints prüft Python NICHT zur</text>
  <text x="765" y="355" fill="#fca5a5" font-size="12.5">  Laufzeit (nur Tools wie mypy)!</text>
</svg>
