<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410">
  <rect width="1100" height="410" fill="#0f172a" rx="14"/>
  <text x="550" y="36" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">LF 3.02 – Schichtenmodelle: OSI (7) vs. DoD/DDN TCP/IP (4)</text>
  <text x="550" y="57" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Jede Schicht fügt ihren Header hinzu (Sender ↓) und wertet nur ihre eigene Schicht aus (Empfänger ↑) (Kersken 5.2)</text>

  <!-- Column headers -->
  <text x="315" y="84" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">OSI-Referenzmodell (ISO, 1978 – 7 Schichten)</text>
  <text x="810" y="84" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">DoD / DDN-Modell (TCP/IP – 4 Schichten)</text>

  <!-- OSI 7 -->
  <rect x="48" y="96" width="534" height="32" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="64" y="117" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">7. Anwendungsschicht (Application)</text>
  <text x="568" y="117" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="end">Benutzernahe Dienste (HTTP, SMTP, FTP)</text>

  <!-- OSI 6 -->
  <rect x="48" y="132" width="534" height="32" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="64" y="153" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">6. Darstellungsschicht (Presentation)</text>
  <text x="568" y="153" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="end">Datenformate, Zeichensätze, HTML-Syntax</text>

  <!-- OSI 5 -->
  <rect x="48" y="168" width="534" height="32" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="64" y="189" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">5. Kommunikationssteuerung (Session)</text>
  <text x="568" y="189" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="end">Kontextwahrende Sitzungen</text>

  <!-- DDN 4 (spans OSI 5-7) -->
  <rect x="605" y="96" width="447" height="104" rx="7" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="828" y="130" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">4. Anwendungsschicht (Application Layer)</text>
  <text x="828" y="153" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">HTTP, FTP, SMTP, POP3/IMAP</text>
  <text x="828" y="174" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">Sessions regelt ggf. die Anwendung selbst</text>

  <!-- OSI 4 -->
  <rect x="48" y="206" width="534" height="32" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="64" y="227" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">4. Transportschicht (Transport)</text>
  <text x="568" y="227" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="end">Ports, Fluss-/Fehlerkontrolle (TCP, UDP)</text>

  <!-- DDN 3 -->
  <rect x="605" y="206" width="447" height="32" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.8"/>
  <text x="828" y="227" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">3. Host-zu-Host-Transportschicht (TCP vs. UDP)</text>

  <!-- OSI 3 -->
  <rect x="48" y="244" width="534" height="32" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="64" y="265" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">3. Vermittlungsschicht (Network)</text>
  <text x="568" y="265" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="end">Logische Adressen, Routing, ARP, IP-Datagramm</text>

  <!-- DDN 2 -->
  <rect x="605" y="244" width="447" height="32" rx="5" fill="#1e293b" stroke="#34d399" stroke-width="1.8"/>
  <text x="828" y="265" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">2. Internetschicht (IP-Adressen &amp; Routing)</text>

  <!-- OSI 2 -->
  <rect x="48" y="282" width="534" height="32" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="64" y="303" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">2. Sicherungsschicht (Data Link)</text>
  <text x="568" y="303" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="end">MAC, LLC, CRC-Prüfsumme, Frames / Zellen</text>

  <!-- OSI 1 -->
  <rect x="48" y="318" width="534" height="32" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="64" y="339" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600">1. Bit-Übertragungsschicht (Physical)</text>
  <text x="568" y="339" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="end">Signale, Bitfolgen, Takt, Medium (Kabel/Funk)</text>

  <!-- DDN 1 (spans OSI 1-2) -->
  <rect x="605" y="282" width="447" height="68" rx="7" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="828" y="311" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">1. Netzzugangsschicht (Link Layer)</text>
  <text x="828" y="332" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" text-anchor="middle">Physische Übertragung &amp; Sicherung (Ethernet, WLAN, PPPoE)</text>

  <!-- Bottom note -->
  <rect x="48" y="362" width="1004" height="32" rx="6" fill="#172554" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="550" y="383" fill="#dbeafe" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Grundregel: Reale Verbindung besteht nur auf Schicht 1! (Scherzhaft: Mensch vor dem Bildschirm = „Layer-8-Fehler“)</text>
</svg>
