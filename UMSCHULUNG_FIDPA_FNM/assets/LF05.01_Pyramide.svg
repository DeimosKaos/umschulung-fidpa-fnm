<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" height="100%" style="background:#0f172a;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Spitze -->
  <rect x="140" y="18" width="820" height="96" rx="12" fill="url(#gTop)" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="550" y="47" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1.2">SPITZE · KERNPROBLEM &amp; ZIEL (LF 5.01)</text>
  <text x="550" y="74" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Daten portabel speichern: Bytes richtig als Text deuten</text>
  <text x="550" y="98" text-anchor="middle" fill="#cbd5e1" font-size="13.5">Von 7-Bit-ASCII über ISO 8859 zu UTF-8 sowie strukturierter Austausch mit CSV &amp; JSON</text>

  <!-- Verbindungslinien -->
  <path d="M550 114 L195 148 M550 114 L550 148 M550 114 L905 148" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Nukleus 1 -->
  <rect x="30" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#818cf8" stroke-width="2"/>
  <text x="195" y="176" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 1 · ZEILEN &amp; ZEICHENSÄTZE</text>
  <line x1="55" y1="188" x2="335" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Zeilenumbrüche (OS-Unterschied):</text>
  <text x="55" y="234" fill="#cbd5e1" font-size="12.5">• Unix/Linux/macOS: LF (\n, 10)</text>
  <text x="55" y="253" fill="#cbd5e1" font-size="12.5">• Windows: CRLF (\r\n, 13+10)</text>
  <text x="55" y="282" fill="#f1f5f9" font-size="13.5" font-weight="600">Codierungsebenen:</text>
  <text x="55" y="302" fill="#cbd5e1" font-size="12.5">• ASCII: 7 Bit (0–127), '0'=48,'A'=65,'a'=97</text>
  <text x="55" y="321" fill="#cbd5e1" font-size="12.5">• ISO 8859-1 / -15 (€): 8 Bit (128–255)</text>
  <text x="55" y="340" fill="#38bdf8" font-size="12.5" font-weight="600">• Unicode + UTF-8: 1–4 Byte variabel,</text>
  <text x="55" y="357" fill="#38bdf8" font-size="12.5">  voll ASCII-abwärtskompatibel (Standard)</text>

  <!-- Nukleus 2 -->
  <rect x="385" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="176" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 2 · CSV, JSON &amp; MARKDOWN</text>
  <line x1="410" y1="188" x2="690" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="410" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">CSV (Tabellendaten):</text>
  <text x="410" y="234" fill="#cbd5e1" font-size="12.5">• Trenner: , oder ; oder \t (Tab)</text>
  <text x="410" y="253" fill="#cbd5e1" font-size="12.5">• Quoting ("..."), Kopfzeile, Escaping</text>
  <text x="410" y="280" fill="#f1f5f9" font-size="13.5" font-weight="600">JSON (Hierarchische API-Daten):</text>
  <text x="410" y="300" fill="#cbd5e1" font-size="12.5">• Objekte {"key": val} &amp; Arrays [1, 2]</text>
  <text x="410" y="319" fill="#cbd5e1" font-size="12.5">• Keys immer in doppelten "..."</text>
  <text x="410" y="346" fill="#f1f5f9" font-size="13.5" font-weight="600">Markdown &amp; LaTeX:</text>
  <text x="410" y="366" fill="#cbd5e1" font-size="12.5">• Leichtgewicht-Text (#, **, *) vs. Satz</text>

  <!-- Nukleus 3 -->
  <rect x="740" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#fbbf24" stroke-width="2"/>
  <text x="905" y="176" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 3 · PYTHON-IMPORT &amp; FALLEN</text>
  <line x1="765" y1="188" x2="1045" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="765" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Sauber parsen statt split(','):</text>
  <text x="765" y="234" fill="#cbd5e1" font-size="12.5">• csv.reader(..., delimiter, quoting)</text>
  <text x="765" y="253" fill="#cbd5e1" font-size="12.5">• json.load(file) vs. json.loads(str)</text>
  <text x="765" y="272" fill="#cbd5e1" font-size="12.5">• try/except json.JSONDecodeError</text>
  <text x="765" y="302" fill="#f87171" font-size="13.5" font-weight="600">Typische IHK-Fallen:</text>
  <text x="765" y="322" fill="#fca5a5" font-size="12.5">• Zeichensatz-Salat (Mojibake): Latin-1</text>
  <text x="765" y="339" fill="#fca5a5" font-size="12.5">  als UTF-8 gelesen (Umlaute defekt)!</text>
  <text x="765" y="356" fill="#fca5a5" font-size="12.5">• Zahlen aus CSV kommen als str!</text>
</svg>
