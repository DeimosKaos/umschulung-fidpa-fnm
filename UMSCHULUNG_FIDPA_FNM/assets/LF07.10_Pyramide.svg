<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="spitzeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="410" rx="14" fill="url(#bgGrad)"/>
  <text x="550" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.2">PYRAMIDENSCHEMA® · LF 7.10: CPS-/OT-SICHERHEIT &amp; WARTUNG IM BETRIEB</text>

  <rect x="140" y="45" width="820" height="86" rx="12" fill="url(#spitzeGrad)" opacity="0.92"/>
  <rect x="140" y="45" width="820" height="86" rx="12" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="550" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#bae6fd" letter-spacing="1">SPITZE (KERNAUSSAGE)</text>
  <text x="550" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">OT-/CPS-Sicherheit priorisiert Verfügbarkeit und schützt langlebige Anlagen</text>
  <text x="550" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">durch IT/OT-Segmentierung, gesicherte VPN/SSH-Fernwartung und signierte OTA-Updates.</text>

  <line x1="550" y1="131" x2="550" y2="155" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="155" x2="900" y2="155" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="155" x2="200" y2="175" stroke="#475569" stroke-width="2"/>
  <line x1="550" y1="155" x2="550" y2="175" stroke="#475569" stroke-width="2"/>
  <line x1="900" y1="155" x2="900" y2="175" stroke="#475569" stroke-width="2"/>

  <rect x="35" y="175" width="330" height="210" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="35" y="175" width="330" height="42" rx="12" fill="#1e3a8a" opacity="0.7"/>
  <text x="200" y="201" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#93c5fd">Nukleus 1: IT vs. OT-Ziele</text>
  <text x="56" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• IT: Vertraulichkeit oft Prio 1</text>
  <text x="56" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• OT/CPS: Verfügbarkeit &amp; Integrität</text>
  <text x="56" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">  (Schutz von Mensch &amp; Produktion!)</text>
  <text x="56" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Keine unkontrollierten Reboots</text>
  <text x="56" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Lange Laufzeiten (15+ Jahre)</text>

  <rect x="385" y="175" width="330" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="385" y="175" width="330" height="42" rx="12" fill="#064e3b" opacity="0.7"/>
  <text x="550" y="201" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">Nukleus 2: Segmentierung (21.2)</text>
  <text x="406" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• IT-Netz und OT-Netz strikt trennen</text>
  <text x="406" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• VLAN + Firewall (kein direktes Web)</text>
  <text x="406" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Fernwartung nur via VPN + Jump-Host</text>
  <text x="406" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• SSH statt Klartext-Telnet nutzen</text>
  <text x="406" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Standard-Passwörter &amp; Ports sperren</text>

  <rect x="735" y="175" width="330" height="210" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="735" y="175" width="330" height="42" rx="12" fill="#78350f" opacity="0.7"/>
  <text x="900" y="201" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#fcd34d">Nukleus 3: Wartung &amp; OTA</text>
  <text x="756" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Passives IDS (Snort) im OT-Netz</text>
  <text x="756" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• OTA-Updates digital signieren!</text>
  <text x="756" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">  (Authentizität &amp; Integrität)</text>
  <text x="756" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• A/B-Partitionen für sicheren</text>
  <text x="756" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">  Rollback bei Update-Fehler</text>
</svg>