<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="410" rx="14" fill="#0f172a"/>
  <path d="M 550 112 L 550 142 L 190 142 L 190 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 142 L 910 142 L 910 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="24" width="820" height="88" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="550" y="52" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">SPITZE · KERNAUSSAGE</text>
  <text x="550" y="78" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Windows nutzt NTFS/ACLs und lässt sich über CMD &amp; PowerShell automatisieren</text>
  <text x="550" y="99" text-anchor="middle" fill="#bfdbfe" font-size="13">(CMD für klassische Text-Befehle · PowerShell für objektorientierte Administration &amp; .ps1-Skripte)</text>

  <rect x="25" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="190" y="204" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">NUKLEUS 1 · SYSTEM &amp; NTFS</text>
  <line x1="50" y1="218" x2="330" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="190" y="248" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Laufwerksbuchstaben (C:\, D:\)</text>
  <text x="190" y="278" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">NTFS vs. FAT32 / exFAT:</text>
  <text x="190" y="298" text-anchor="middle" fill="#cbd5e1" font-size="12.5">NTFS: Journaling, Rechte (ACL),</text>
  <text x="190" y="318" text-anchor="middle" fill="#cbd5e1" font-size="12.5">große Dateien (&gt; 4 GB), Kompression</text>
  <text x="190" y="352" text-anchor="middle" fill="#94a3b8" font-size="12.5">Windows Terminal vereint CMD &amp; PS</text>

  <rect x="385" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="204" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">NUKLEUS 2 · CMD &amp; PIPES</text>
  <line x1="410" y1="218" x2="690" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="550" y="248" text-anchor="middle" fill="#cbd5e1" font-size="12.5">dir, cd, copy, del, ipconfig, ping</text>
  <text x="550" y="280" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Umleitung &amp; Pipe:</text>
  <text x="550" y="302" text-anchor="middle" fill="#cbd5e1" font-size="12.5">&gt; (überschreiben) · &gt;&gt; (anhängen)</text>
  <text x="550" y="324" text-anchor="middle" fill="#cbd5e1" font-size="12.5">| (Pipe: Ausgabe → nächste Eingabe)</text>
  <text x="550" y="356" text-anchor="middle" fill="#94a3b8" font-size="12.5">.bat-Dateien (Batch) &amp; PATH-Variable</text>

  <rect x="745" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="910" y="204" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">NUKLEUS 3 · POWERSHELL</text>
  <line x1="770" y1="218" x2="1050" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="910" y="248" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Cmdlets: Verb-Substantiv</text>
  <text x="910" y="268" text-anchor="middle" fill="#cbd5e1" font-size="12.5">Get-ChildItem · Get-Command</text>
  <text x="910" y="300" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Objekt-Pipeline (.NET):</text>
  <text x="910" y="322" text-anchor="middle" fill="#cbd5e1" font-size="12.5">übergibt echte Objekte (Where-Object)</text>
  <text x="910" y="354" text-anchor="middle" fill="#94a3b8" font-size="12.5">.ps1-Skripte &amp; Set-ExecutionPolicy</text>
</svg>
