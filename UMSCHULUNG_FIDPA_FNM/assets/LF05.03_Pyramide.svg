<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" height="100%" style="background:#0f172a;font-family:system-ui,-apple-system,sans-serif;">
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gN1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Spitze -->
  <rect x="140" y="18" width="820" height="96" rx="12" fill="url(#gTop)" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="550" y="47" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1.2">SPITZE · KERNPROBLEM &amp; ZIEL (LF 5.03)</text>
  <text x="550" y="74" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">Python-Fundament: Werte, Objekte &amp; Container sicher steuern</text>
  <text x="550" y="98" text-anchor="middle" fill="#cbd5e1" font-size="13.5">Einrückung, dynamische Typisierung, Mutability, Operatoren sowie Listen &amp; Tupel</text>

  <!-- Verbindungslinien -->
  <path d="M550 114 L195 148 M550 114 L550 148 M550 114 L905 148" stroke="#475569" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Nukleus 1 -->
  <rect x="30" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#818cf8" stroke-width="2"/>
  <text x="195" y="176" text-anchor="middle" fill="#818cf8" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 1 · SYNTAX &amp; OBJEKTE</text>
  <line x1="55" y1="188" x2="335" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Syntax &amp; Typen:</text>
  <text x="55" y="234" fill="#cbd5e1" font-size="12.5">• Blöcke durch Einrückung (4 Spaces)</text>
  <text x="55" y="253" fill="#cbd5e1" font-size="12.5">• int (beliebig groß), float, str, bool</text>
  <text x="55" y="272" fill="#cbd5e1" font-size="12.5">• Dynamisch typisiert: type(x), id(x)</text>
  <text x="55" y="300" fill="#f1f5f9" font-size="13.5" font-weight="600">Mutable vs. Immutable:</text>
  <text x="55" y="320" fill="#38bdf8" font-size="12.5">• Immutable: int, float, str, tuple</text>
  <text x="55" y="339" fill="#38bdf8" font-size="12.5">• Mutable: list, dict, set (in-place)</text>
  <text x="55" y="362" fill="#94a3b8" font-size="12">Variablen sind Referenzen auf Objekte!</text>

  <!-- Nukleus 2 -->
  <rect x="385" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="176" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 2 · OPERATOREN &amp; CONTAINER</text>
  <line x1="410" y1="188" x2="690" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="410" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Operatoren-Kern:</text>
  <text x="410" y="234" fill="#cbd5e1" font-size="12.5">• / (float), // (Ganzzahl), % (Rest), **</text>
  <text x="410" y="253" fill="#cbd5e1" font-size="12.5">• Short-Circuit: and / or stoppen früh</text>
  <text x="410" y="272" fill="#cbd5e1" font-size="12.5">• == (Wert) vs. is (Objekt-ID), in</text>
  <text x="410" y="300" fill="#f1f5f9" font-size="13.5" font-weight="600">Listen [a, b] &amp; Tupel (a, b):</text>
  <text x="410" y="320" fill="#cbd5e1" font-size="12.5">• Index 0-basiert, negativ von hinten (-1)</text>
  <text x="410" y="339" fill="#cbd5e1" font-size="12.5">• Slicing [start:ende:step] erzeugt Kopie</text>
  <text x="410" y="358" fill="#cbd5e1" font-size="12.5">• 1-Element-Tupel braucht Komma: (1,)</text>

  <!-- Nukleus 3 -->
  <rect x="740" y="148" width="330" height="240" rx="12" fill="url(#gN1)" stroke="#fbbf24" stroke-width="2"/>
  <text x="905" y="176" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="0.8">NUKLEUS 3 · PRAXIS &amp; IHK-FALLE</text>
  <line x1="765" y1="188" x2="1045" y2="188" stroke="#334155" stroke-width="1.5"/>
  <text x="765" y="214" fill="#f1f5f9" font-size="13.5" font-weight="600">Typische Praxis-Muster:</text>
  <text x="765" y="234" fill="#cbd5e1" font-size="12.5">• Kopie statt Alias: b = a[:] oder list(a)</text>
  <text x="765" y="253" fill="#cbd5e1" font-size="12.5">• Bitflags mit &amp;, |, ^ prüfen/schalten</text>
  <text x="765" y="282" fill="#f87171" font-size="13.5" font-weight="600">Typische IHK-Fallen:</text>
  <text x="765" y="302" fill="#fca5a5" font-size="12.5">• b = a bei Listen kopiert NICHT,</text>
  <text x="765" y="319" fill="#fca5a5" font-size="12.5">  beide zeigen auf dasselbe Objekt!</text>
  <text x="765" y="338" fill="#fca5a5" font-size="12.5">• 3 == "3" ist False (kein Auto-Cast)</text>
  <text x="765" y="357" fill="#fca5a5" font-size="12.5">• Endindex beim Slice ist exklusiv!</text>
</svg>
