<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410">
  <rect width="1100" height="410" fill="#0f172a" rx="14"/>
  <text x="550" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">LF 2.09 – Virtualisierung, Container (Docker) &amp; Cloud Computing</text>
  <text x="550" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Ungenutzte CPU-/RAM-Ressourcen bündeln: VM vs. Container vs. Mietmodell (Kersken 14.4)</text>

  <!-- Column 1: Virtualisierung (VM) -->
  <rect x="48" y="82" width="318" height="306" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="207" y="108" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1. Virtuelle Maschine (VM)</text>
  <rect x="66" y="124" width="282" height="44" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="207" y="144" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Eigenes Gast-Betriebssystem</text>
  <text x="207" y="160" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">z. B. Linux-Gast auf Windows-Host</text>

  <rect x="66" y="178" width="282" height="40" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="207" y="196" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Hypervisor / VM-Manager</text>
  <text x="207" y="211" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">VirtualBox, VMware, Hyper-V, Xen, Parallels</text>

  <rect x="66" y="228" width="282" height="34" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
  <text x="207" y="249" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Host-Betriebssystem + echte Hardware</text>

  <text x="68" y="286" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">VirtualBox-Praxis:</text>
  <text x="68" y="306" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Formate: VDI (Standard), VHD, VMDK</text>
  <text x="68" y="324" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Platte: feste Größe vs. dynamisch alloziert</text>
  <text x="68" y="342" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Guest Additions (Shared Folders/Clipboard)</text>
  <text x="68" y="360" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Snapshots &amp; Vagrant (übertragbare VMs)</text>

  <!-- Column 2: Container (Docker) -->
  <rect x="391" y="82" width="318" height="306" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="108" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2. Container (Docker)</text>
  <rect x="409" y="124" width="136" height="44" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="477" y="144" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Container A</text>
  <text x="477" y="160" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">z. B. MySQL</text>
  <rect x="555" y="124" width="136" height="44" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="623" y="144" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">Container B</text>
  <text x="623" y="160" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">z. B. Webserver</text>

  <rect x="409" y="178" width="282" height="40" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="550" y="196" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Docker Engine (teilt Host-Kernel)</text>
  <text x="550" y="211" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Kein eigenes Gast-OS → viel sparsamer</text>

  <rect x="409" y="228" width="282" height="34" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>
  <text x="550" y="249" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Host-Betriebssystem (Linux nativ)</text>

  <text x="411" y="286" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Wichtige Docker-Optionen:</text>
  <text x="411" y="306" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• -p Host:Container (Portweiterleitung)</text>
  <text x="411" y="324" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• -d (Detach / Hintergrund) &amp; --restart</text>
  <text x="411" y="342" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• -v lokal:container (persistente Daten)</text>
  <text x="411" y="360" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Dockerfile &amp; Orchestrierung: Kubernetes</text>

  <!-- Column 3: Cloud Computing -->
  <rect x="734" y="82" width="318" height="306" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="893" y="108" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">3. Cloud Computing (Mietmodell)</text>

  <rect x="752" y="124" width="282" height="48" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="893" y="145" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SaaS – Software as a Service</text>
  <text x="893" y="162" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Fertige Software mieten inkl. Updates</text>

  <rect x="752" y="182" width="282" height="48" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="893" y="203" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">PaaS – Platform as a Service</text>
  <text x="893" y="220" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Gezielte Dienste: DB, Storage (S3), Streaming</text>

  <rect x="752" y="240" width="282" height="48" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="893" y="261" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">IaaS – Infrastructure as a Service</text>
  <text x="893" y="278" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Virtuelle Hardware + OS (z. B. AWS EC2, Azure)</text>

  <text x="754" y="314" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Bare Metal Cloud: dedizierte Server/Stunde</text>
  <text x="754" y="334" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Steuerung über REST-APIs &amp; SDKs</text>
  <text x="754" y="354" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 99–100 % Uptime, aber lokale Backups nötig!</text>
</svg>
