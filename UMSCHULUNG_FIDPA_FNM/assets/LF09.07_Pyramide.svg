<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="spitzeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="410" rx="14" fill="url(#bgGrad)"/>
  <text x="550" y="30" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.2">PYRAMIDENSCHEMA® · LF 9.07: WAN, DSL/MOBILFUNK &amp; VPN-ANBINDUNGEN</text>

  <rect x="140" y="45" width="820" height="86" rx="12" fill="url(#spitzeGrad)" opacity="0.92"/>
  <rect x="140" y="45" width="820" height="86" rx="12" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="550" y="62" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#bae6fd" letter-spacing="1">SPITZE (KERNAUSSAGE)</text>
  <text x="550" y="78" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">WAN-Technologien (SDSL, Glasfaser, 5G) liefern die Leitung ins Internet,</text>
  <text x="550" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">NAT/PAT teilt öffentliche IPs und VPN-Tunnel verbinden Standorte sicher.</text>

  <line x1="550" y1="131" x2="550" y2="155" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="155" x2="900" y2="155" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="155" x2="200" y2="175" stroke="#475569" stroke-width="2"/>
  <line x1="550" y1="155" x2="550" y2="175" stroke="#475569" stroke-width="2"/>
  <line x1="900" y1="155" x2="900" y2="175" stroke="#475569" stroke-width="2"/>

  <rect x="35" y="175" width="330" height="210" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="35" y="175" width="330" height="42" rx="12" fill="#1e3a8a" opacity="0.7"/>
  <text x="200" y="201" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#93c5fd">Nukleus 1: DSL, Glasfaser, 5G</text>
  <text x="56" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• ADSL: asymmetrisch (Down &gt; Up)</text>
  <text x="56" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• SDSL: symmetrisch (Server/Upload)</text>
  <text x="56" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• VDSL/FTTC vs. FTTH (Glasfaser)</text>
  <text x="56" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• 4G/5G: mobil oder Failover-Backup</text>
  <text x="56" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Standleitung oft zu teuer -&gt; WAN</text>

  <rect x="385" y="175" width="330" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="385" y="175" width="330" height="42" rx="12" fill="#064e3b" opacity="0.7"/>
  <text x="550" y="201" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">Nukleus 2: NAT &amp; Masquerading</text>
  <text x="406" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Private IPs (RFC 1918) im LAN</text>
  <text x="406" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• NAT/PAT: viele LAN-IPs auf 1 WAN-IP</text>
  <text x="406" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Unterscheidung über Portnummern</text>
  <text x="406" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Linux iptables: MASQUERADE</text>
  <text x="406" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• DNAT / Portforwarding für Server</text>

  <rect x="735" y="175" width="330" height="210" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="735" y="175" width="330" height="42" rx="12" fill="#78350f" opacity="0.7"/>
  <text x="900" y="201" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#fcd34d">Nukleus 3: VPN-Tunnel</text>
  <text x="756" y="245" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Tunnel durch unsicheres Internet</text>
  <text x="756" y="266" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Protokolle: IPsec, WireGuard, TLS</text>
  <text x="756" y="287" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Site-to-Site: Zentrale &lt;-&gt; Filiale</text>
  <text x="756" y="308" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• End-to-Site: Homeoffice &lt;-&gt; Firma</text>
  <text x="756" y="329" font-family="Inter, system-ui, sans-serif" font-size="13.5" fill="#cbd5e1">• Verschlüsselung durch Protokoll!</text>
</svg>