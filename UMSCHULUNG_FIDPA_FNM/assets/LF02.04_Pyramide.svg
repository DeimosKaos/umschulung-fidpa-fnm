<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1100" height="410" rx="14" fill="#0f172a"/>
  <path d="M 550 112 L 550 142 L 190 142 L 190 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 550 112 L 550 142 L 910 142 L 910 170" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="140" y="24" width="820" height="88" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="550" y="52" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="1">SPITZE · KERNAUSSAGE</text>
  <text x="550" y="78" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600">Mainboard, Firmware (UEFI) &amp; Busse verbinden CPU, RAM und Peripherie zum System</text>
  <text x="550" y="99" text-anchor="middle" fill="#bfdbfe" font-size="13">(Startprüfung durch UEFI/POST · schneller Datentransport über PCIe, NVMe &amp; USB)</text>

  <rect x="25" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="190" y="204" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">NUKLEUS 1 · BIOS vs. UEFI</text>
  <line x1="50" y1="218" x2="330" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="190" y="248" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="600">P.O.S.T. (Power-On Self-Test):</text>
  <text x="190" y="268" text-anchor="middle" fill="#cbd5e1" font-size="12.5">prüft Hardware + Beep-Codes bei Fehlern</text>
  <text x="190" y="300" text-anchor="middle" fill="#cbd5e1" font-size="12.5">BIOS: alt (16 Bit, MBR max. 2 TB)</text>
  <text x="190" y="322" text-anchor="middle" fill="#38bdf8" font-size="12.5" font-weight="600">UEFI: modern (GPT &gt; 2 TB, GUI, Maus)</text>
  <text x="190" y="352" text-anchor="middle" fill="#94a3b8" font-size="12.5">Secure Boot: lädt nur signierte OS</text>

  <rect x="385" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="204" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">NUKLEUS 2 · INTERNE BUSSE</text>
  <line x1="410" y1="218" x2="690" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="550" y="248" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">PCIe (PCI Express):</text>
  <text x="550" y="268" text-anchor="middle" fill="#cbd5e1" font-size="12.5">seriell, Punkt-zu-Punkt über Lanes (x1–x16)</text>
  <text x="550" y="300" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Massenspeicher-Anbindung:</text>
  <text x="550" y="320" text-anchor="middle" fill="#cbd5e1" font-size="12.5">SATA (max. ~600 MB/s) vs.</text>
  <text x="550" y="340" text-anchor="middle" fill="#34d399" font-size="12.5" font-weight="600">M.2 / NVMe (direkt über PCIe, sehr schnell)</text>
  <text x="550" y="366" text-anchor="middle" fill="#94a3b8" font-size="12">Chipsatz verbindet CPU mit I/O-Ports</text>

  <rect x="745" y="174" width="330" height="210" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="910" y="204" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">NUKLEUS 3 · EXTERNE PORTS</text>
  <line x1="770" y1="218" x2="1050" y2="218" stroke="#334155" stroke-width="1"/>
  <text x="910" y="248" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">USB (Hot-Plug-fähig):</text>
  <text x="910" y="268" text-anchor="middle" fill="#cbd5e1" font-size="12.5">USB 2.0 (480 Mbit/s) · USB 3.x (5–20 Gbit/s)</text>
  <text x="910" y="290" text-anchor="middle" fill="#cbd5e1" font-size="12.5">USB-C (verdrehsicher, Power Delivery)</text>
  <text x="910" y="324" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Thunderbolt &amp; Video:</text>
  <text x="910" y="346" text-anchor="middle" fill="#94a3b8" font-size="12.5">Thunderbolt: PCIe + DisplayPort + Strom</text>
  <text x="910" y="366" text-anchor="middle" fill="#94a3b8" font-size="12.5">DisplayPort &amp; HDMI (digital Bild + Ton)</text>
</svg>
