<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410">
  <rect width="1100" height="410" fill="#0f172a" rx="14"/>
  <text x="550" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">LF 3.10 – Netzwerke prüfen/konfigurieren &amp; E-Technik-Grundlagen</text>
  <text x="550" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Systematische Fehlersuche auf den Schichten plus Ohmsches Gesetz &amp; Schaltalgebra (Kersken 3.1 &amp; 5.6)</text>

  <!-- Left: Netzwerkdiagnose -->
  <rect x="48" y="80" width="492" height="308" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="294" y="106" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">1. Netzwerke prüfen &amp; konfigurieren (Schichten-Check)</text>

  <rect x="66" y="122" width="456" height="62" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="142" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Schicht 1–2 (Hardware &amp; Link)</text>
  <text x="80" y="162" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Kabel/RJ-45/Link-LEDs, Switch-Port, MAC/ARP, ggf. WLAN-SSID/WPA2</text>

  <rect x="66" y="192" width="456" height="90" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="212" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Schicht 3 (IP &amp; Routing)</text>
  <text x="80" y="232" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• IP, Subnetzmaske, Default-Gateway prüfen (kein 169.254.x.x Link-Local!)</text>
  <text x="80" y="250" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• ping 127.0.0.1 (Stack) → ping Gateway → ping Ziel-IP (ICMP)</text>
  <text x="80" y="268" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• netstat -rn: Routing-Tabelle &amp; default-Eintrag kontrollieren</text>

  <rect x="66" y="290" width="456" height="78" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="310" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Schicht 4–7 (DNS, Ports &amp; Dienste)</text>
  <text x="80" y="330" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• DNS vs. IP trennen (/etc/hosts prüfen) | /etc/services für Ports</text>
  <text x="80" y="348" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• telnet &lt;Host&gt; &lt;Port&gt; testet gezielt, ob ein TCP-Dienst lauscht</text>

  <!-- Right: E-Technik & Schaltungen -->
  <rect x="560" y="80" width="492" height="308" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="806" y="106" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">2. Elektronische Grundlagen (Kersken 3.1)</text>

  <rect x="578" y="122" width="456" height="106" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="592" y="142" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Elektrische Größen &amp; Ohmsches Gesetz</text>
  <text x="592" y="162" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Spannung U in Volt (V): Potenzialdifferenz → U = I · R</text>
  <text x="592" y="180" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Stromstärke I in Ampere (A, SI-Basiseinheit) → I = U / R</text>
  <text x="592" y="198" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Widerstand R in Ohm (Ω) → R = U / I | Leitwert G = 1/R (Siemens S)</text>
  <text x="592" y="216" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Praxis: Stabile Stromversorgung schützt Server &amp; Switches vor Ausfällen</text>

  <rect x="578" y="236" width="456" height="132" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="592" y="256" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Einfache Schaltungen &amp; Transistoren (Schaltalgebra)</text>
  <text x="592" y="276" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Reihenschaltung zweier Schalter = logisches UND (beide zu → 1)</text>
  <text x="592" y="295" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Parallelschaltung zweier Schalter = logisches ODER (einer zu → 1)</text>
  <text x="592" y="314" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• MOS-Transistor (Emitter/Source, Kollektor/Drain, Gate):</text>
  <text x="600" y="331" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Steuerspannung am Gate schaltet Stromfluss → Basis für NOT &amp; CPUs</text>
</svg>
