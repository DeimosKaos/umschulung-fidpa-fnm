<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410">
  <rect width="1100" height="410" fill="#0f172a" rx="14"/>
  <text x="550" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">LF 3.06 – TCP/IP-Netzzugang (ARP), IPv4, CIDR &amp; Subnetting</text>
  <text x="550" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Wie logische IP-Adressen auf MAC-Adressen treffen und Netze flexibel geteilt werden (Kersken 5.6.1–5.6.2)</text>

  <!-- Col 1: ARP & IPv4 -->
  <rect x="48" y="80" width="318" height="308" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="207" y="106" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">1. ARP &amp; IPv4-Grundlagen</text>

  <rect x="66" y="122" width="282" height="84" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="142" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">ARP (Address Resolution Protocol)</text>
  <text x="80" y="161" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Hardware kennt keine IPs → ARP nötig</text>
  <text x="80" y="179" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Broadcast ins LAN: „Wer hat IP X?“</text>
  <text x="80" y="196" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Ziel-Host antwortet mit seiner MAC</text>

  <rect x="66" y="214" width="282" height="154" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="234" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">IPv4 (32 Bit = 4×8 Bit dezimal)</text>
  <text x="80" y="254" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Netzwerkteil + Hostteil</text>
  <text x="80" y="273" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Privat (RFC 1918): 10.0.0.0,</text>
  <text x="88" y="289" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">172.16–31.x.x, 192.168.0–255.x</text>
  <text x="80" y="309" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 127.0.0.1 = Loopback (eigener Host)</text>
  <text x="80" y="328" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 169.254.0.0 = Link-Local (ohne DHCP)</text>
  <text x="80" y="347" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 255.255.255.255 = univ. Broadcast</text>

  <!-- Col 2: Klassen -> CIDR -->
  <rect x="391" y="80" width="318" height="308" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="106" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">2. Von Klassen zu CIDR</text>

  <rect x="409" y="122" width="282" height="92" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="423" y="142" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Alte Klassen (1993 abgelöst)</text>
  <text x="423" y="161" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• A (/8, 16,7 Mio.) | B (/16, 65.534)</text>
  <text x="423" y="179" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• C (/24, 254 Hosts) | D (Multicast)</text>
  <text x="423" y="198" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11">Zu unflexibel → feste Byte-Grenzen!</text>

  <rect x="409" y="224" width="282" height="144" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="423" y="244" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">CIDR &amp; Teilnetzmaske</text>
  <text x="423" y="264" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Beliebige Bit-Grenze: z. B. /18 oder /26</text>
  <text x="423" y="283" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Maske: Netz-Bits = 1, Host-Bits = 0</text>
  <text x="423" y="302" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Netzadresse = IP &amp; Maske (bitweise UND)</text>
  <text x="423" y="324" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 1. Adresse = Netz | Letzte = Broadcast</text>
  <text x="423" y="344" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Nutzbare Hosts = 2^(Host-Bits) − 2</text>

  <!-- Col 3: Subnetting, Supernetting, VLSM -->
  <rect x="734" y="80" width="318" height="308" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="893" y="106" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">3. Subnetting, Supernetting &amp; VLSM</text>

  <rect x="752" y="122" width="282" height="76" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="766" y="142" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Subnetting (Teilen)</text>
  <text x="766" y="161" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Netz-Grenze nach rechts verschieben</text>
  <text x="766" y="179" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">z. B. /16 in 4 Netze (+2 Bit) → /18</text>

  <rect x="752" y="206" width="282" height="72" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="766" y="226" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Supernetting (Bündeln)</text>
  <text x="766" y="245" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Netz-Grenze nach links verschieben</text>
  <text x="766" y="263" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">z. B. 4× /24-Netze (−2 Bit) → /22</text>

  <rect x="752" y="286" width="282" height="82" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="766" y="306" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">VLSM (Variable Masken)</text>
  <text x="766" y="325" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Verschieden große Teilnetze (/27, /26, /25)</text>
  <text x="766" y="343" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Spart Adressen; vom kleinsten Netz planen</text>
</svg>
