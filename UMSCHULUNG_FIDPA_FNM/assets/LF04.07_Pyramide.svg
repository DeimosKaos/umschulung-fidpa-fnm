<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410">
  <rect width="1100" height="410" fill="#0f172a" rx="14"/>
  <text x="550" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">LF 4.07 – Schutzbedarfs- &amp; Risikoanalyse (BSI 200-2 &amp; 200-3)</text>
  <text x="550" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Vom Schutzbedarf (C-I-A) über Vererbungseffekte zur Risikoanalyse und den 4 Risikobehandlungs-Optionen</text>

  <!-- Col 1: Schutzbedarf -->
  <rect x="48" y="80" width="318" height="308" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="207" y="106" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">1. Schutzbedarfsfeststellung</text>

  <rect x="66" y="122" width="282" height="114" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="142" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3 Kategorien (getrennt für C, I, A)</text>
  <text x="80" y="162" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Normal: Schaden begrenzt/überschaubar</text>
  <text x="80" y="181" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Hoch: Schaden beträchtlich</text>
  <text x="80" y="200" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Sehr hoch: existenziell / katastrophal</text>
  <text x="80" y="220" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Ab „Hoch“ → Risikoanalyse (BSI 200-3)!</text>

  <rect x="66" y="244" width="282" height="128" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="264" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Vererbung auf IT-Systeme</text>
  <text x="80" y="284" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Maximumprinzip: höchster Schutzbedarf</text>
  <text x="88" y="300" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">der laufenden Prozesse bestimmt System</text>
  <text x="80" y="321" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Kumulationseffekt: viele „normale“</text>
  <text x="88" y="337" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Dienste auf 1 Server → gesamt höher!</text>

  <!-- Col 2: Risikoanalyse -->
  <rect x="391" y="80" width="318" height="308" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="550" y="106" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">2. Risikoanalyse (BSI 200-3)</text>

  <rect x="409" y="122" width="282" height="250" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="423" y="144" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Ablauf bei hohem Schutzbedarf:</text>
  <text x="423" y="170" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">1. Zielobjekt wählen (Prozess/Server)</text>
  <text x="423" y="196" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">2. Gefährdungen sammeln</text>
  <text x="431" y="213" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">(elementare + spezifische Gefahren)</text>
  <text x="423" y="237" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">3. Risiko bewerten:</text>
  <text x="431" y="256" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Eintrittshäufigkeit × Schadenshöhe</text>
  <text x="423" y="282" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">4. Risiko behandeln &amp; dokumentieren</text>
  <text x="423" y="320" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Merke: Verteilungseffekt kann umgekehrt</text>
  <text x="423" y="336" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">durch Redundanz Schutzbedarf senken.</text>

  <!-- Col 3: Risikobehandlung -->
  <rect x="734" y="80" width="318" height="308" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="893" y="106" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">3. Die 4 Risikobehandlungen</text>

  <rect x="752" y="122" width="282" height="56" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="766" y="142" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">1. Vermeiden (Avoid)</text>
  <text x="766" y="160" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Riskanten Dienst/Prozess abschaffen</text>

  <rect x="752" y="186" width="282" height="56" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="766" y="206" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">2. Vermindern (Mitigate)</text>
  <text x="766" y="224" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">TOMs/Technik (Firewall, Backup, Krypto)</text>

  <rect x="752" y="250" width="282" height="56" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="766" y="270" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">3. Übertragen (Transfer)</text>
  <text x="766" y="288" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Cyber-Versicherung oder Outsourcing</text>

  <rect x="752" y="314" width="282" height="58" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="766" y="334" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">4. Akzeptieren (Accept)</text>
  <text x="766" y="352" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">Restrisiko bewusst durch Leitung tragen</text>
</svg>
