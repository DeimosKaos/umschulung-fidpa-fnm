<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410">
  <rect width="1100" height="410" fill="#0f172a" rx="14"/>
  <text x="550" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">LF 3.08 – Transportprotokolle: TCP vs. UDP, Ports &amp; ICMP</text>
  <text x="550" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Host-zu-Host-Transport: Zuverlässigkeit mit 3-Wege-Handshake vs. Tempo ohne Overhead (Kersken 5.6.3)</text>

  <!-- Col 1: TCP -->
  <rect x="48" y="80" width="340" height="308" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="218" y="106" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">1. TCP (verbindungsorientiert)</text>

  <rect x="66" y="122" width="304" height="90" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="142" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Drei-Wege-Handshake</text>
  <text x="80" y="162" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">1. Client → Server: SYN (Start-ISN)</text>
  <text x="80" y="180" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">2. Server → Client: SYN + ACK</text>
  <text x="80" y="198" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">3. Client → Server: ACK → Datenfluss!</text>

  <rect x="66" y="220" width="304" height="148" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.3"/>
  <text x="80" y="240" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Header &amp; Zuverlässigkeit</text>
  <text x="80" y="260" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Sequenz- &amp; Bestätigungsnummer (Bytes)</text>
  <text x="80" y="279" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Positive Acknowledgement + Time-out</text>
  <text x="80" y="298" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Flags: URG, ACK, PSH, RST, SYN, FIN</text>
  <text x="80" y="317" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Fenster (Empfangspuffer) &amp; Prüfsumme</text>
  <text x="80" y="340" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Ideal für Web, Mail, Downloads (Reihenfolge!)</text>

  <!-- Col 2: UDP & ICMP -->
  <rect x="406" y="80" width="300" height="308" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="556" y="106" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">2. UDP &amp; ICMP</text>

  <rect x="424" y="122" width="264" height="146" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="438" y="142" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">UDP (nachrichtenorientiert)</text>
  <text x="438" y="162" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Verbindungslos, kein Handshake</text>
  <text x="438" y="181" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Winziger 64-Bit-Header (8 Byte):</text>
  <text x="446" y="198" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Quellport, Zielport, Länge, Prüfsumme</text>
  <text x="438" y="218" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Sehr schnell, minimaler Overhead</text>
  <text x="438" y="238" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11">z. B. DNS, Zeit, Echo, 3D-Spiele-Posen</text>

  <rect x="424" y="276" width="264" height="92" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
  <text x="438" y="296" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">ICMP (zwischen IP &amp; Transport)</text>
  <text x="438" y="316" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Spezielle Steuer-/Status-Datagramme</text>
  <text x="438" y="335" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Tool: ping &lt;Host/IP&gt; prüft Erreichbarkeit</text>

  <!-- Col 3: Ports -->
  <rect x="724" y="80" width="328" height="308" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="888" y="106" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" text-anchor="middle">3. Ports (16 Bit: Prozesse trennen)</text>

  <rect x="742" y="122" width="292" height="72" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="756" y="142" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Portpaare &amp; Bereiche (IANA)</text>
  <text x="756" y="161" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Well-Known Ports: 0–1023 (Server)</text>
  <text x="756" y="179" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Ephemeral Ports: 1024–65535 (Client)</text>

  <rect x="742" y="202" width="292" height="166" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="756" y="222" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Wichtige IHK-Ports (/etc/services)</text>
  <text x="756" y="243" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 20 / 21 (TCP): FTP Daten / Steuerung</text>
  <text x="756" y="262" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 22 (TCP): SSH | 23 (TCP): Telnet</text>
  <text x="756" y="281" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 25 (TCP): SMTP | 53 (TCP/UDP): DNS</text>
  <text x="756" y="300" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 80 (TCP): HTTP | 443 (TCP/UDP): HTTPS</text>
  <text x="756" y="319" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 110 (TCP): POP3 | 143 (TCP): IMAP</text>
  <text x="756" y="344" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Mehrere Browser-Tabs = versch. Client-Ports</text>
</svg>
